<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>LoL Map Editor — assets-manager</title>
<style>
  :root{ --bg:#1b1820; --panel:#252231; --line:#3a3650; --txt:#eaf2ff; --mut:#8fa4c4; --accent:#bf6979; }
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  #bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
  #bar .grp{display:flex;gap:4px;align-items:center;padding-right:8px;border-right:1px solid var(--line)}
  button,select,input[type=number]{background:#16131e;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;font-size:12px}
  button.on{background:var(--accent);border-color:var(--accent);color:#160d12}
  label{color:var(--mut);font-size:12px}
  input[type=number]{width:52px}
  #main{flex:1;display:flex;min-height:0}
  #palWrap{width:372px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#15121c}
  #palHead{padding:6px 10px;color:var(--mut);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
  #palScroll{overflow:auto;flex:1;padding:6px}
  #pal{image-rendering:pixelated;display:block;cursor:crosshair}
  #stage{flex:1;overflow:auto;padding:16px;background:#0f0d14 repeating-linear-gradient(45deg,#11101a 0 8px,#0f0d14 8px 16px)}
  #map{image-rendering:pixelated;cursor:crosshair;box-shadow:0 0 0 1px var(--line)}
  #status{padding:4px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--mut);font-size:12px}
  .sel{color:var(--accent)}
</style>
</head>
<body>
<div id="bar">
  <div class="grp"><label>Gruppo</label><select id="grpSel"></select></div>
  <div class="grp"><label>Tool</label>
    <button data-tool="paint" class="tool on">✏️ Pennello</button>
    <button data-tool="erase" class="tool">🧽 Gomma</button>
    <button data-tool="fill" class="tool">🪣 Riempi</button>
    <button data-tool="pick" class="tool">💉 Preleva</button>
    <button data-tool="terr" class="tool">🧱 Terreno</button>
    <select id="terrSel"><option value="siepe">🌳 Siepe</option><option value="muro_dungeon">🧱 Muro dungeon</option><option value="pond">💧 Laghetto</option></select>
    <button id="schemeBtn">⚙️ Schemi</button>
  </div>
  <div class="grp"><label>Layer tile</label>
    <button data-layer="ground" class="layer on">Terreno</button>
    <button data-layer="over" class="layer">Sopra</button>
  </div>
  <div class="grp"><label>Mix</label>
    <button id="mixBtn">🎨 Mix off</button>
    <button id="mixClr">✕ mix</button>
    <label>dens</label><input type="range" id="dens" min="5" max="100" step="5" value="100" style="width:70px"><span id="densV">100%</span>
  </div>
  <div class="grp"><label>Preset</label>
    <select id="preset"><option value="">—</option><option value="grass">🌱 Erba base</option><option value="flowers">🌼 Fiori (overlay)</option><option value="rocks">🪨 Sassi (overlay)</option></select>
  </div>
  <div class="grp"><label>Mappa</label>
    <input type="number" id="mCols" value="24" min="4" max="160">×<input type="number" id="mRows" value="16" min="4" max="160">
    <button id="resize">Ridim.</button><button id="clear">Svuota</button>
  </div>
  <div class="grp"><label>Zoom</label><input type="range" id="zoom" min="1" max="4" step="1" value="2">
    <label><input type="checkbox" id="grid" checked> griglia</label></div>
  <div class="grp" style="border:0">
    <button id="expPng">⬇ PNG</button><button id="expJson">⬇ JSON</button>
    <button id="impBtn">⬆ Importa</button><input type="file" id="impFile" accept="application/json" style="display:none">
  </div>
</div>
<div id="schemePanel" style="display:none;padding:8px 10px;background:#1a1626;border-bottom:1px solid var(--line)">
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
    <b style="font-size:13px">⚙️ Editor schemi autotile</b>
    <label>Nome</label><input id="schName" placeholder="es. recinto" style="background:#16131e;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 8px;width:130px">
    <label>Tipo</label>
    <select id="schType">
      <option value="edge4">edge-4bit (siepi/recinti/sentieri)</option>
      <option value="zelda">muro-Zelda (top/front)</option>
      <option value="shore">riva-overlay (laghetti)</option>
    </select>
    <button id="schBlock">🧩 Auto da blocco 3×3</button>
    <button id="schSave">💾 Salva</button>
    <button id="schExport">⬇ Esporta JSON</button>
    <button id="schClose">✕</button>
  </div>
  <div style="display:flex;gap:16px;align-items:flex-start">
    <div id="schSlots" style="display:grid;grid-template-columns:repeat(8,56px);gap:4px"></div>
    <div><div style="color:var(--mut);font-size:11px;margin-bottom:3px">anteprima</div><canvas id="schPrev" style="image-rendering:pixelated;box-shadow:0 0 0 1px var(--line)"></canvas></div>
  </div>
  <div id="schMsg" style="color:var(--mut);font-size:12px;margin-top:6px">Clicca uno slot, poi un tile nella palette. "Auto da blocco": poi clicca l'angolo ALTO-SX del blocco 3×3 nel tileset.</div>
</div>
<div id="main">
  <div id="palWrap">
    <div id="palHead"><span id="palTitle">Palette</span><span id="palSel" class="sel">—</span></div>
    <div id="palScroll"><canvas id="pal"></canvas></div>
  </div>
  <div id="stage"><canvas id="map"></canvas></div>
</div>
<div id="status">Pronto. Tile → dipingi celle. Sprite (Vegetazione/…) → piazza oggetti ancorati. Esporta PNG + JSON.</div>

<script src="tilesets.js"></script>
<script src="sprites.js"></script>
<script>
const TS = window.TILESETS, GROUPS = window.SPRITE_GROUPS, T = 16;
const GLIST = [
  ...Object.keys(TS).map(k=>({type:'tileset', key:k, name:'Tiles · '+k})),
  ...GROUPS.map((g,gi)=>({type:'sprites', gi, name:g.name})),
];
let curG = 0, tool = 'paint', layer = 'ground', palScale = 2, zoom = 2, showGrid = true;
let sel = null;                                   // {type:'tile',ts,c,r} | {type:'sprite',name}
let mixMode = false, mixSet = [], density = 100;  // mix "ts|c|r"; density = % celle riempite (overlay sparso)
let terrain = 'siepe', terrainCells = {};         // 🧱 autotile: key "x,y" -> nome terreno (risolto nei layer normali)
// TERRAINS: coord verificate in tools/assets-manager/atlas/tileset_atlas.json (skill pixel-art-tilemaps).
// edge4: bitmask U=1,R=2,D=4,L=8 (vicino stesso terreno). muro: regola-Zelda (front se sotto NON è muro).
// pond: acqua base su ground + riva OVERLAY trasparente su over (centro trasparente).
const TERRAINS = {
  siepe: { type: 'edge4', ts: 'overworld', layer: 'over', lut: {   // tile a sfondo trasparente → over, l'erba resta sotto
    15:[2,14], 14:[2,13], 7:[1,14], 13:[3,14], 11:[2,15],
    6:[1,13], 12:[3,13], 3:[1,15], 9:[3,15],
    5:[1,14], 10:[2,13], 1:[0,15], 4:[0,14], 2:[0,16], 8:[1,16], 0:[2,14] } },
  muro_dungeon: { type: 'zelda', ts: 'overworld', layer: 'ground', top: [33,17], front: [33,18] },
  pond: { type: 'shore', ts: 'overworld', water: [16,1], shore: {
    // chiave = lati DOVE MANCA l'acqua (u/r/d/l concatenati in quest'ordine)
    'u':[16,6], 'd':[16,8], 'l':[15,7], 'r':[17,7],
    'ul':[15,6], 'ur':[17,6], 'dl':[15,8], 'dr':[17,8],
    '':null } }   // circondata d'acqua → nessuna riva (centro trasparente)
};
function terrAt(x,y,name){ return terrainCells[x+','+y]===name; }
function terrResolveCell(x,y){
  const name=terrainCells[x+','+y]; if(!name) return;
  const T2=TERRAINS[name];
  const u=terrAt(x,y-1,name),r=terrAt(x+1,y,name),d=terrAt(x,y+1,name),l=terrAt(x-1,y,name);
  if(T2.type==='edge4'){
    const mask=(u?1:0)+(r?2:0)+(d?4:0)+(l?8:0);
    const c=T2.lut[mask]||T2.lut[0];
    layers[T2.layer][y][x]=`${T2.ts}|${c[0]}|${c[1]}`;
  } else if(T2.type==='zelda'){
    const below=(y+1>=rows)?true:terrAt(x,y+1,name);        // bordo mappa = muro
    const c=below?T2.top:T2.front;
    layers[T2.layer][y][x]=`${T2.ts}|${c[0]}|${c[1]}`;
  } else if(T2.type==='shore'){
    layers.ground[y][x]=`${T2.ts}|${T2.water[0]}|${T2.water[1]}`;
    let miss=''; if(!u&&y-1>=0)miss+='u'; if(!d&&y+1<rows)miss+='d'; if(!l&&x-1>=0)miss+='l'; if(!r&&x+1<cols)miss+='r';
    // normalizza all'ordine delle chiavi note; 3+ lati mancanti → usa i primi 2
    const order=['u','d','l','r']; miss=order.filter(k=>miss.includes(k)).join('');
    let c=T2.shore[miss];
    if(c===undefined){ // sporgenze (3+ lati scoperti): usa la prima combo a 2 lati contenuta in miss, poi 1 lato
      const keys=Object.keys(T2.shore).filter(k=>k.length===2&&[...k].every(ch=>miss.includes(ch)));
      c=keys.length?T2.shore[keys[0]]:(T2.shore[miss[0]]||null); }
    layers.over[y][x]=c?`${T2.ts}|${c[0]}|${c[1]}`:null;
  }
}
function terrPaint(x,y){
  terrainCells[x+','+y]=terrain;
  terrResolveCell(x,y); terrResolveCell(x,y-1); terrResolveCell(x+1,y); terrResolveCell(x,y+1); terrResolveCell(x-1,y);
}
function terrErase(x,y){
  if(!terrainCells[x+','+y]) return false;
  delete terrainCells[x+','+y];
  layers.ground[y][x]=null; layers.over[y][x]=null;
  terrResolveCell(x,y-1); terrResolveCell(x+1,y); terrResolveCell(x,y+1); terrResolveCell(x-1,y);
  return true;
}
// ─── ⚙️ EDITOR SCHEMI AUTOTILE: definisci terrain-def visivamente (slot ruolo → tile dalla palette) ───
// Persist: localStorage 'mapedit_terrains'. Export: JSON compatibile con atlas/tileset_atlas.json → terrains.
const SCHEME_SLOTS = {
  edge4: [ {k:15,l:'centro'},{k:14,l:'lato ↑'},{k:11,l:'lato ↓'},{k:7,l:'lato ←'},{k:13,l:'lato →'},
           {k:6,l:'ang ↖'},{k:12,l:'ang ↗'},{k:3,l:'ang ↙'},{k:9,l:'ang ↘'},
           {k:5,l:'canna │'},{k:10,l:'canna ─'},{k:1,l:'fine ↓'},{k:4,l:'fine ↑'},{k:2,l:'fine ←'},{k:8,l:'fine →'},{k:0,l:'isolato'} ],
  zelda: [ {k:'top',l:'TOP / cap'},{k:'front',l:'FRONT'} ],
  shore: [ {k:'water',l:'acqua base'},{k:'u',l:'riva ↑'},{k:'d',l:'riva ↓'},{k:'l',l:'riva ←'},{k:'r',l:'riva →'},
           {k:'ul',l:'riva ↖'},{k:'ur',l:'riva ↗'},{k:'dl',l:'riva ↙'},{k:'dr',l:'riva ↘'} ]
};
let schemeOpen=false, schemeType='edge4', schemeSlots={}, schemeWait=null, schemeBlockWait=false;
function schMsg(m){ document.getElementById('schMsg').textContent=m; }
function schCompile(){
  const keys=Object.keys(schemeSlots); if(!keys.length) return null;
  const ts=schemeSlots[keys[0]].ts;
  if(keys.some(k=>schemeSlots[k].ts!==ts)){ schMsg('⚠ tutti i tile devono venire dallo stesso tileset'); return null; }
  if(schemeType==='edge4'){
    if(!schemeSlots[15]) { schMsg('⚠ manca il tile "centro" (mask 15)'); return null; }
    const lut={}; SCHEME_SLOTS.edge4.forEach(s=>{ const v=schemeSlots[s.k]; lut[s.k]=v?[v.c,v.r]:[schemeSlots[15].c,schemeSlots[15].r]; });
    const ck=`${ts}|${schemeSlots[15].c}|${schemeSlots[15].r}`;
    return { type:'edge4', ts:ts, layer: keyHasAlpha(ck)?'over':'ground', lut:lut };
  }
  if(schemeType==='zelda'){
    if(!schemeSlots.top||!schemeSlots.front){ schMsg('⚠ servono TOP e FRONT'); return null; }
    return { type:'zelda', ts:ts, layer:'ground', top:[schemeSlots.top.c,schemeSlots.top.r], front:[schemeSlots.front.c,schemeSlots.front.r] };
  }
  if(schemeType==='shore'){
    if(!schemeSlots.water){ schMsg('⚠ manca "acqua base"'); return null; }
    const shore={ '':null }; ['u','d','l','r','ul','ur','dl','dr'].forEach(k=>{ if(schemeSlots[k]) shore[k]=[schemeSlots[k].c,schemeSlots[k].r]; });
    return { type:'shore', ts:ts, water:[schemeSlots.water.c,schemeSlots.water.r], shore:shore };
  }
  return null;
}
function schPreview(){
  const cv=document.getElementById('schPrev'), S=22, W=12, H=8;
  cv.width=W*S; cv.height=H*S; const x2=cv.getContext('2d'); x2.imageSmoothingEnabled=false;
  x2.fillStyle='#0d0b12'; x2.fillRect(0,0,cv.width,cv.height);
  const def=schCompile(); if(!def) return;
  const set={}; const put=(a,b)=>set[a+','+b]=1;
  for(let x=2;x<9;x++)put(x,2); for(let y=3;y<6;y++)put(2,y); for(let x=3;x<6;x++)put(x,5); put(7,4); put(10,3);   // L + braccio + appendice + isolato
  const at=(a,b)=>!!set[a+','+b];
  const draw=(c,dx,dy)=>{ if(c) x2.drawImage(tsImg[def.ts], c[0]*T,c[1]*T,T,T, dx*S,dy*S,S,S); };
  for(const k in set){ const p=k.split(',').map(Number), u=at(p[0],p[1]-1),r=at(p[0]+1,p[1]),d=at(p[0],p[1]+1),l=at(p[0]-1,p[1]);
    if(def.type==='edge4'){ draw(def.lut[(u?1:0)+(r?2:0)+(d?4:0)+(l?8:0)]||def.lut[15],p[0],p[1]); }
    else if(def.type==='zelda'){ draw(d?def.top:def.front,p[0],p[1]); }
    else { draw(def.water,p[0],p[1]); let miss=''; ['u','d','l','r'].forEach((kk,i)=>{ if(![u,d,l,r][i]) miss+=kk; });
      let c=def.shore[miss]; if(c===undefined){ const ks=Object.keys(def.shore).filter(q=>q.length===2&&[...q].every(ch=>miss.includes(ch))); c=ks.length?def.shore[ks[0]]:(def.shore[miss[0]]||null); }
      draw(c,p[0],p[1]); }
  }
}
function schRender(){
  const box=document.getElementById('schSlots'); box.innerHTML='';
  SCHEME_SLOTS[schemeType].forEach(s=>{
    const d=document.createElement('div'); const v=schemeSlots[s.k];
    d.style.cssText='width:56px;height:56px;border-radius:6px;cursor:pointer;text-align:center;font-size:9px;color:#b8c8e0;padding-top:2px;background:#16131e;border:1.5px solid '+(schemeWait===s.k?'#bf6979':'#3a3650');
    d.textContent=s.l;
    if(v){ const c2=document.createElement('canvas'); c2.width=32; c2.height=32; c2.style.cssText='display:block;margin:2px auto;image-rendering:pixelated';
      const g2=c2.getContext('2d'); g2.imageSmoothingEnabled=false; g2.drawImage(tsImg[v.ts], v.c*T,v.r*T,T,T, 0,0,32,32); d.appendChild(c2); }
    d.onclick=()=>{ schemeWait=(schemeWait===s.k)?null:s.k; schemeBlockWait=false; schRender(); schMsg(schemeWait!=null?('Slot "'+s.l+'": clicca un tile nella palette'):'—'); };
    box.appendChild(d);
  });
  schPreview();
}
function schAutoBlock(ts,c0,r0){
  if(schemeType==='edge4'){ const M={6:[0,0],14:[1,0],12:[2,0],7:[0,1],15:[1,1],13:[2,1],3:[0,2],11:[1,2],9:[2,2]};
    for(const k in M) schemeSlots[k]={ts:ts,c:c0+M[k][0],r:r0+M[k][1]}; }
  else if(schemeType==='shore'){ const M={ul:[0,0],u:[1,0],ur:[2,0],l:[0,1],r:[2,1],dl:[0,2],d:[1,2],dr:[2,2]};
    for(const k in M) schemeSlots[k]={ts:ts,c:c0+M[k][0],r:r0+M[k][1]}; schMsg('Blocco assegnato. Manca "acqua base": assegnala a mano.'); }
  else { schMsg('Auto-blocco non disponibile per muro-Zelda (assegna TOP e FRONT a mano)'); return; }
  schRender();
}
function schLoadCustoms(){
  try{ const cs=JSON.parse(localStorage.getItem('mapedit_terrains')||'{}');
    for(const n in cs){ const old=schemeType, oldSlots=schemeSlots; schemeType=cs[n].type; schemeSlots=cs[n].slots;
      const def=schCompile(); if(def) TERRAINS[n]=def; schemeType=old; schemeSlots=oldSlots; }
  }catch(e){}
  rebuildTerrSel();
}
function rebuildTerrSel(){
  const s=document.getElementById('terrSel'), cur=terrain;
  s.innerHTML=Object.keys(TERRAINS).map(n=>`<option value="${n}">${n==='siepe'?'🌳 Siepe':n==='muro_dungeon'?'🧱 Muro dungeon':n==='pond'?'💧 Laghetto':'⚙️ '+n}</option>`).join('');
  s.value=TERRAINS[cur]?cur:Object.keys(TERRAINS)[0]; terrain=s.value;
}
let cols = 24, rows = 16, layers, objects = [];
const palCv = document.getElementById('pal'), palCx = palCv.getContext('2d');
const mapCv = document.getElementById('map'), mapCx = mapCv.getContext('2d');
const THUMB = 72;

const tsImg = {}, sprImg = {}, sprByName = {};
function mk(){ return Array.from({length:rows},()=>Array(cols).fill(null)); }
function initMap(){ layers = { ground: mk(), over: mk() }; objects = []; terrainCells = {}; }
initMap();

let need = Object.keys(TS).length, loaded = 0;
GROUPS.forEach(g=>g.items.forEach(it=>{ need++; sprByName[it.name]=it; }));
function done(){ if(++loaded>=need){ computeAlpha(); buildGrpSel(); schLoadCustoms(); renderPal(); renderMap(); } }
// per ogni tile: ha pixel trasparenti? (→ è un "oggetto", va sopra l'erba, non sul terreno)
const TSALPHA={};
function computeAlpha(){
  for(const k in TS){ const m=TS[k], off=document.createElement('canvas'); off.width=m.w; off.height=m.h;
    const o=off.getContext('2d'); o.drawImage(tsImg[k],0,0);
    let d; try{ d=o.getImageData(0,0,m.w,m.h).data; }catch(e){ TSALPHA[k]=null; continue; }
    const grid=[];
    for(let r=0;r<m.rows;r++){ const row=[];
      for(let c=0;c<m.cols;c++){ let a=false;
        for(let y=0;y<T&&!a;y++) for(let x=0;x<T;x++){ if(d[((r*T+y)*m.w+(c*T+x))*4+3]<200){a=true;break;} }
        row.push(a); }
      grid.push(row); }
    TSALPHA[k]=grid; }
}
function keyHasAlpha(key){ if(!key) return false; const[ts,c,r]=key.split('|'); return !!(TSALPHA[ts]&&TSALPHA[ts][+r]&&TSALPHA[ts][+r][+c]); }
function tileLayer(key){ return (keyHasAlpha(key) && layer==='ground') ? 'over' : layer; }   // oggetti trasparenti → Sopra
for (const k in TS){ const i=new Image(); i.onload=done; i.onerror=done; i.src=TS[k].src; tsImg[k]=i; }
GROUPS.forEach(g=>g.items.forEach(it=>{ const i=new Image(); i.onload=done; i.onerror=done; i.src=it.src; sprImg[it.name]=i; }));

function buildGrpSel(){
  const s=document.getElementById('grpSel');
  s.innerHTML = GLIST.map((g,i)=>`<option value="${i}">${g.name}</option>`).join('');
  s.onchange=()=>{ curG=+s.value; renderPal(); };
}

function renderPal(){
  const g = GLIST[curG];
  document.getElementById('palTitle').textContent = g.type==='tileset' ? 'Tile — clicca per dipingere' : 'Sprite — clicca per piazzare';
  if (g.type==='tileset'){
    const m=TS[g.key]; palCv.width=m.w*palScale; palCv.height=m.h*palScale;
    palCx.imageSmoothingEnabled=false; palCx.clearRect(0,0,palCv.width,palCv.height);
    palCx.drawImage(tsImg[g.key],0,0,m.w*palScale,m.h*palScale);
    if(showGrid){ palCx.strokeStyle='rgba(255,255,255,.12)';
      for(let c=0;c<=m.cols;c++){palCx.beginPath();palCx.moveTo(c*T*palScale+.5,0);palCx.lineTo(c*T*palScale+.5,palCv.height);palCx.stroke();}
      for(let r=0;r<=m.rows;r++){palCx.beginPath();palCx.moveTo(0,r*T*palScale+.5);palCx.lineTo(palCv.width,r*T*palScale+.5);palCx.stroke();} }
    if(sel&&sel.type==='tile'&&sel.ts===g.key){ palCx.strokeStyle='#bf6979';palCx.lineWidth=2;
      palCx.strokeRect(sel.c*T*palScale,sel.r*T*palScale,T*palScale,T*palScale); }
    if(mixMode){ palCx.strokeStyle='#5fcde4'; palCx.lineWidth=2;
      mixSet.forEach(k=>{ const[ts,c,r]=k.split('|'); if(ts===g.key) palCx.strokeRect(c*T*palScale,r*T*palScale,T*palScale,T*palScale); }); }
    const dr=palDrag||(sel&&sel.type==='block'&&sel.ts===g.key?{c0:sel.c0,r0:sel.r0,c1:sel.c0+sel.w-1,r1:sel.r0+sel.h-1}:null);
    if(dr){ const c0=Math.min(dr.c0,dr.c1),r0=Math.min(dr.r0,dr.r1),w=Math.abs(dr.c1-dr.c0)+1,h=Math.abs(dr.r1-dr.r0)+1;
      palCx.strokeStyle='#fbf236'; palCx.lineWidth=2; palCx.strokeRect(c0*T*palScale,r0*T*palScale,w*T*palScale,h*T*palScale); }
  } else {
    const items=GROUPS[g.gi].items, ncol=Math.max(1,Math.floor(360/THUMB));
    palCv.width=ncol*THUMB; palCv.height=Math.ceil(items.length/ncol)*THUMB;
    palCx.imageSmoothingEnabled=false; palCx.clearRect(0,0,palCv.width,palCv.height);
    items.forEach((it,idx)=>{
      const cx=(idx%ncol)*THUMB, cy=Math.floor(idx/ncol)*THUMB;
      palCx.fillStyle='#1d1a26'; palCx.fillRect(cx+1,cy+1,THUMB-2,THUMB-2);
      const s=Math.min((THUMB-12)/it.fw,(THUMB-16)/it.fh,3);
      palCx.drawImage(sprImg[it.name],0,0,it.fw,it.fh, cx+(THUMB-it.fw*s)/2, cy+2+(THUMB-12-it.fh*s)/2, it.fw*s,it.fh*s);
      if(sel&&sel.type==='sprite'&&sel.name===it.name){ palCx.strokeStyle='#bf6979';palCx.lineWidth=2;palCx.strokeRect(cx+1,cy+1,THUMB-2,THUMB-2); }
    });
  }
}
// TILESET: drag per selezionare un BLOCCO di tile (1×1 = tile singolo). Sprite/mix = click.
let palDrag=null;
function palTileAt(e){ const r=palCv.getBoundingClientRect(); return { c:Math.floor((e.clientX-r.left)/(T*palScale)), r:Math.floor((e.clientY-r.top)/(T*palScale)) }; }
palCv.addEventListener('mousedown', e=>{ const g=GLIST[curG];
  if(g.type==='tileset' && !mixMode){ const t=palTileAt(e); palDrag={c0:t.c,r0:t.r,c1:t.c,r1:t.r}; renderPal(); } });
palCv.addEventListener('mousemove', e=>{ if(palDrag){ const t=palTileAt(e); palDrag.c1=t.c; palDrag.r1=t.r; renderPal(); } });
window.addEventListener('mouseup', ()=>{ if(!palDrag) return; const g=GLIST[curG];
  const c0=Math.min(palDrag.c0,palDrag.c1), r0=Math.min(palDrag.r0,palDrag.r1);
  const w=Math.abs(palDrag.c1-palDrag.c0)+1, h=Math.abs(palDrag.r1-palDrag.r0)+1;
  if(w===1&&h===1){ sel={type:'tile',ts:g.key,c:c0,r:r0}; document.getElementById('palSel').textContent=`${g.key} [${c0},${r0}]`; }
  else { sel={type:'block',ts:g.key,c0,r0,w,h}; document.getElementById('palSel').textContent=`blocco ${w}×${h} @[${c0},${r0}]`; }
  palDrag=null; renderPal(); });
palCv.addEventListener('click', e=>{ const g=GLIST[curG], r=palCv.getBoundingClientRect();
  if(schemeOpen && g.type==='tileset'){ const t=palTileAt(e);   // ⚙️ editor schemi: assegnazione slot/blocco
    if(schemeBlockWait){ schAutoBlock(g.key,t.c,t.r); schemeBlockWait=false; return; }
    if(schemeWait!=null){ schemeSlots[schemeWait]={ts:g.key,c:t.c,r:t.r}; schemeWait=null; schRender(); schMsg('Assegnato ✓ — clicca il prossimo slot.'); return; }
  }
  if(g.type==='tileset'){ if(mixMode){ const t=palTileAt(e), k=`${g.key}|${t.c}|${t.r}`, i=mixSet.indexOf(k);
      if(i>=0) mixSet.splice(i,1); else mixSet.push(k); document.getElementById('palSel').textContent=`mix: ${mixSet.length} tile`; renderPal(); } }
  else { const items=GROUPS[g.gi].items, ncol=Math.max(1,Math.floor(360/THUMB));
    const idx=Math.floor((e.clientY-r.top)/THUMB)*ncol + Math.floor((e.clientX-r.left)/THUMB);
    if(items[idx]){ sel={type:'sprite',name:items[idx].name}; document.getElementById('palSel').textContent=items[idx].name; renderPal(); } }
});

function drawTile(cx, val, dx, dy, sc){
  if(!val) return; const[ts,c,r]=val.split('|'); const im=tsImg[ts]; if(!im) return;
  cx.drawImage(im, c*T,r*T,T,T, dx,dy,T*sc,T*sc);
}
function drawSprite(cx, o, sc){
  const it=sprByName[o.name], im=sprImg[o.name]; if(!it||!im) return;
  const dx=(o.x*T + T/2) - it.fw/2, dy=(o.y*T + T) - it.fh;     // ancorato bottom-center sulla cella
  cx.drawImage(im, 0,0,it.fw,it.fh, dx*sc,dy*sc, it.fw*sc,it.fh*sc);
}
function renderMap(){
  const sc=zoom; mapCv.width=cols*T*sc; mapCv.height=rows*T*sc;
  mapCx.imageSmoothingEnabled=false; mapCx.fillStyle='#0c0a10'; mapCx.fillRect(0,0,mapCv.width,mapCv.height);
  for(const ln of ['ground','over']) for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) drawTile(mapCx,layers[ln][y][x],x*T*sc,y*T*sc,sc);
  objects.slice().sort((a,b)=>a.y-b.y).forEach(o=>drawSprite(mapCx,o,sc));
  if(showGrid){ mapCx.strokeStyle='rgba(255,255,255,.10)';
    for(let x=0;x<=cols;x++){mapCx.beginPath();mapCx.moveTo(x*T*sc+.5,0);mapCx.lineTo(x*T*sc+.5,mapCv.height);mapCx.stroke();}
    for(let y=0;y<=rows;y++){mapCx.beginPath();mapCx.moveTo(0,y*T*sc+.5);mapCx.lineTo(mapCv.width,y*T*sc+.5);mapCx.stroke();} }
}

function cellAt(e){ const r=mapCv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/(T*zoom)), y=Math.floor((e.clientY-r.top)/(T*zoom));
  return (x>=0&&y>=0&&x<cols&&y<rows)?{x,y}:null; }
function topObjAt(x,y){ for(let i=objects.length-1;i>=0;i--) if(objects[i].x===x&&objects[i].y===y) return i; return -1; }
function usingMix(){ return mixMode && mixSet.length>0; }
function chooseTile(){                              // mix → tile a caso; altrimenti il singolo selezionato
  if(usingMix()) return mixSet[(Math.random()*mixSet.length)|0];
  if(sel && sel.type==='tile') return `${sel.ts}|${sel.c}|${sel.r}`;
  return null;
}
function apply(cell){
  if(!cell) return;
  if(tool==='pick'){ const oi=topObjAt(cell.x,cell.y);
    if(oi>=0){ sel={type:'sprite',name:objects[oi].name}; switchToSpriteGroup(objects[oi].name); }
    else { const v=layers.over[cell.y][cell.x]||layers.ground[cell.y][cell.x]; if(v){ const[ts,c,r]=v.split('|'); sel={type:'tile',ts,c:+c,r:+r}; switchToTilesetGroup(ts);} }
    renderPal(); return; }
  if(tool==='erase'){ const oi=topObjAt(cell.x,cell.y);
    if(oi>=0) objects.splice(oi,1);
    else if(terrErase(cell.x,cell.y)) { /* cella-terreno rimossa + vicini ri-risolti */ }
    else if(layers.over[cell.y][cell.x]) layers.over[cell.y][cell.x]=null;
    else layers.ground[cell.y][cell.x]=null;
    renderMap(); return; }
  if(tool==='terr'){ terrPaint(cell.x,cell.y); renderMap(); return; }   // 🧱 autotile
  // BLOCCO multi-tile (case/fontane/statue): stampa il blocco, ogni tile sul layer giusto
  if(!usingMix() && sel && sel.type==='block'){
    for(let dy=0;dy<sel.h;dy++) for(let dx=0;dx<sel.w;dx++){ const x=cell.x+dx, y=cell.y+dy; if(x>=cols||y>=rows) continue;
      const key=`${sel.ts}|${sel.c0+dx}|${sel.r0+dy}`; layers[tileLayer(key)][y][x]=key; }
    renderMap(); return; }
  // sprite stamp
  if(!usingMix() && sel && sel.type==='sprite'){ objects.push({name:sel.name,x:cell.x,y:cell.y}); renderMap(); return; }
  // tile singolo/mix (routing per trasparenza)
  if(!usingMix() && !(sel&&sel.type==='tile')) return;
  if(tool==='fill'){ const probe=chooseTile(); const fl=(probe&&keyHasAlpha(probe)&&layer==='ground')?'over':layer;
    floodFill(fl, cell.x, cell.y, layers[fl][cell.y][cell.x]); }
  else { const tk=chooseTile(); if(tk) layers[tileLayer(tk)][cell.y][cell.x]=tk; }
  renderMap();
}
function floodFill(ln,x,y,target){                 // per-cella random dal mix; densità = overlay sparso
  const g=layers[ln], st=[[x,y]], seen=new Set();
  while(st.length){ const[cx,cy]=st.pop(), k=cx+','+cy;
    if(cx<0||cy<0||cx>=cols||cy>=rows||seen.has(k)||g[cy][cx]!==target) continue;
    seen.add(k); if(Math.random()*100 < density) g[cy][cx]=chooseTile()||g[cy][cx];
    st.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]); } }
function switchToTilesetGroup(ts){ const i=GLIST.findIndex(g=>g.type==='tileset'&&g.key===ts); if(i>=0){curG=i;document.getElementById('grpSel').value=i;} }
function switchToSpriteGroup(name){ const i=GLIST.findIndex(g=>g.type==='sprites'&&GROUPS[g.gi].items.some(it=>it.name===name)); if(i>=0){curG=i;document.getElementById('grpSel').value=i;} }

let down=false;
mapCv.addEventListener('mousedown',e=>{down=true;apply(cellAt(e));});
mapCv.addEventListener('mousemove',e=>{ const c=cellAt(e); if(c) document.getElementById('status').textContent=`cella [${c.x},${c.y}] · ${sel?(sel.type==='sprite'?'sprite '+sel.name:'tile '+sel.ts):'—'} · ${tool}`;
  if(down&&((tool==='paint'&&(usingMix()||(sel&&sel.type==='tile')))||tool==='terr'||tool==='erase')) apply(c); });
window.addEventListener('mouseup',()=>down=false);

document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('on',x===b));});
document.querySelectorAll('.layer').forEach(b=>b.onclick=()=>{layer=b.dataset.layer;document.querySelectorAll('.layer').forEach(x=>x.classList.toggle('on',x===b));});
document.getElementById('zoom').oninput=e=>{zoom=+e.target.value;renderMap();};
document.getElementById('grid').onchange=e=>{showGrid=e.target.checked;renderPal();renderMap();};
document.getElementById('resize').onclick=()=>{ const nc=+document.getElementById('mCols').value,nr=+document.getElementById('mRows').value;
  const mk2=()=>Array.from({length:nr},()=>Array(nc).fill(null)),nl={ground:mk2(),over:mk2()};
  for(const ln of ['ground','over'])for(let y=0;y<Math.min(nr,rows);y++)for(let x=0;x<Math.min(nc,cols);x++)nl[ln][y][x]=layers[ln][y][x];
  cols=nc;rows=nr;layers=nl;objects=objects.filter(o=>o.x<nc&&o.y<nr);
  Object.keys(terrainCells).forEach(k=>{const p=k.split(',');if(+p[0]>=nc||+p[1]>=nr)delete terrainCells[k];});
  renderMap(); };
document.getElementById('clear').onclick=()=>{ if(confirm('Svuotare la mappa?')){initMap();renderMap();} };
document.getElementById('mixBtn').onclick=()=>{ mixMode=!mixMode; const b=document.getElementById('mixBtn');
  b.textContent='🎨 Mix '+(mixMode?'on':'off'); b.classList.toggle('on',mixMode);
  document.getElementById('palSel').textContent = mixMode?`mix: ${mixSet.length} tile`:'—'; renderPal(); };
document.getElementById('mixClr').onclick=()=>{ mixSet=[]; document.getElementById('palSel').textContent=mixMode?'mix: 0 tile':'—'; renderPal(); };
document.getElementById('dens').oninput=e=>{ density=+e.target.value; document.getElementById('densV').textContent=density+'%'; };
document.getElementById('terrSel').onchange=e=>{ terrain=e.target.value; };
document.getElementById('schemeBtn').onclick=()=>{ schemeOpen=!schemeOpen; document.getElementById('schemePanel').style.display=schemeOpen?'block':'none'; if(schemeOpen) schRender(); };
document.getElementById('schType').onchange=e=>{ schemeType=e.target.value; schemeSlots={}; schemeWait=null; schRender(); };
document.getElementById('schBlock').onclick=()=>{ schemeBlockWait=true; schemeWait=null; schMsg('Clicca l\'angolo ALTO-SX del blocco 3×3 nel tileset…'); };
document.getElementById('schSave').onclick=()=>{
  const n=(document.getElementById('schName').value||'').trim(); if(!n){ schMsg('⚠ dai un nome allo schema'); return; }
  const def=schCompile(); if(!def) return;
  TERRAINS[n]=def;
  const cs=JSON.parse(localStorage.getItem('mapedit_terrains')||'{}'); cs[n]={type:schemeType,slots:schemeSlots};
  localStorage.setItem('mapedit_terrains',JSON.stringify(cs));
  rebuildTerrSel(); document.getElementById('terrSel').value=n; terrain=n;
  schMsg('💾 Salvato "'+n+'" — già selezionato nel pennello 🧱.'); };
document.getElementById('schExport').onclick=()=>{
  const cs=JSON.parse(localStorage.getItem('mapedit_terrains')||'{}'); const out={};
  const old={t:schemeType,s:schemeSlots};
  for(const n in cs){ schemeType=cs[n].type; schemeSlots=cs[n].slots; out[n]={scheme:cs[n].type, def:schCompile(), slots:cs[n].slots}; }
  schemeType=old.t; schemeSlots=old.s;
  const a=document.createElement('a'); a.download='terrains.json';
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'})); a.click(); };
document.getElementById('schClose').onclick=()=>{ schemeOpen=false; document.getElementById('schemePanel').style.display='none'; };
const PRESETS={
  grass:  { mix:['overworld|0|9','overworld|0|10','overworld|1|10','overworld|5|10','overworld|6|10','overworld|7|10'], dens:100, layer:'ground' },   // solo tile pieni: [0,11]/[1,11] sono edge con bianco, [4,10] ha il bordo-cliff
  flowers:{ mix:['overworld|2|11','overworld|3|11','overworld|2|12','overworld|3|12'], dens:14, layer:'over' },
  rocks:  { mix:['overworld|11|22','overworld|12|22','overworld|12|23'], dens:8, layer:'over' },
};
function setLayerUI(l){ layer=l; document.querySelectorAll('.layer').forEach(x=>x.classList.toggle('on',x.dataset.layer===l)); }
function setToolUI(t){ tool=t; document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('on',x.dataset.tool===t)); }
document.getElementById('preset').onchange=e=>{ const p=PRESETS[e.target.value]; if(!p) return;
  mixMode=true; mixSet=p.mix.slice(); density=p.dens; setLayerUI(p.layer); setToolUI('fill');
  const b=document.getElementById('mixBtn'); b.textContent='🎨 Mix on'; b.classList.add('on');
  document.getElementById('dens').value=density; document.getElementById('densV').textContent=density+'%';
  document.getElementById('palSel').textContent=`mix: ${mixSet.length} tile`;
  const gi=GLIST.findIndex(g=>g.type==='tileset'&&g.key==='overworld'); if(gi>=0){ curG=gi; document.getElementById('grpSel').value=gi; }
  renderPal();
  document.getElementById('status').textContent=`Preset ${e.target.value}: ${mixSet.length} tile · densità ${density}% · layer ${layer} · Riempi un'area`;
};

document.getElementById('expPng').onclick=()=>{
  const off=document.createElement('canvas');off.width=cols*T;off.height=rows*T;
  const ox=off.getContext('2d');ox.imageSmoothingEnabled=false;
  for(const ln of ['ground','over'])for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)drawTile(ox,layers[ln][y][x],x*T,y*T,1);
  objects.slice().sort((a,b)=>a.y-b.y).forEach(o=>drawSprite(ox,o,1));
  const a=document.createElement('a');a.download='map.png';a.href=off.toDataURL('image/png');a.click(); };
document.getElementById('expJson').onclick=()=>{
  const data={version:2,tile:T,cols,rows,
    layers:['ground','over'].map(n=>({name:n,data:layers[n].map(r=>r.map(v=>{if(!v)return null;const[ts,c,r2]=v.split('|');return{ts,c:+c,r:+r2};}))})),
    objects:objects.map(o=>({name:o.name,x:o.x,y:o.y}))};
  const a=document.createElement('a');a.download='map.json';
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.click(); };
document.getElementById('impBtn').onclick=()=>document.getElementById('impFile').click();
document.getElementById('impFile').onchange=e=>{ const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result);cols=d.cols;rows=d.rows;terrainCells={};
    const mk2=()=>Array.from({length:rows},()=>Array(cols).fill(null));layers={ground:mk2(),over:mk2()};objects=[];
    (d.layers||[]).forEach(L=>{const g=layers[L.name]||layers.ground;L.data.forEach((row,y)=>row.forEach((v,x)=>{if(v)g[y][x]=`${v.ts}|${v.c}|${v.r}`;}));});
    (d.objects||[]).forEach(o=>{if(sprByName[o.name])objects.push({name:o.name,x:o.x,y:o.y});});
    document.getElementById('mCols').value=cols;document.getElementById('mRows').value=rows;renderMap();
  }catch(err){alert('JSON non valido: '+err.message);} }; rd.readAsText(f); };
</script>
