<!doctype html>
<html lang="it" class="ui">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlante MappAI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<!-- Regola 10: il sistema unico della UI. Si importa, non si copia. -->
<link rel="stylesheet" href="../../public/css/mappai-ui.css">
<style>
  /* Solo layout di pagina, dai token: rail a sinistra, mappa a destra. */
  html, body { margin: 0; height: 100%; }
  body { display: grid; grid-template-columns: 300px 1fr; background: var(--ui-fondo); color: var(--ui-testo); font-family: var(--ui-font); }
  main { display: flex; min-width: 0; }
  iframe { flex: 1; width: 100%; border: 0; background: var(--ui-pannello); }
  @media (max-width: 760px) {
    body { height: auto; min-height: 100vh; grid-template-columns: 1fr; }
    .ui-rail { border-right: 0; border-bottom: 1px solid var(--ui-bordo); }
    iframe { min-height: 80vh; }
  }
</style>
</head>
<body>
<aside class="ui-rail" role="tablist" aria-label="Mappe">
  <h1 class="ui-rail-titolo">Atlante MappAI</h1>
  <p class="ui-rail-sotto">Nove mappe generate dal codice. Ogni voce apre una sezione del progetto.</p>

  <p class="ui-eyebrow">Struttura</p>
  <button type="button" class="ui-voce" data-src="mappai.architecture.html"><span class="n">01</span><b>Architettura</b><small>Renderer, preload, main, Gemini, vault, server LAN.</small></button>
  <button type="button" class="ui-voce" data-src="chiamata-llm.sequence.html"><span class="n">02</span><b>Una chiamata al LLM</b><small>Da fetchModelAPI al POST e ritorno, con salvataggio JSON.</small></button>

  <p class="ui-eyebrow">Flussi</p>
  <button type="button" class="ui-voce" data-src="pdf-a-json.workflow.html"><span class="n">03</span><b>Dal PDF al JSON</b><small>Triage, Fase 1, Fase 3, deepening, àncora, copertura, vault.</small></button>
  <button type="button" class="ui-voce" data-src="json-a-domanda.workflow.html"><span class="n">04</span><b>Dal JSON alla domanda aperta</b><small>Ramo L1 → materiale con fonti → una chiamata → foglio PDF.</small></button>
  <button type="button" class="ui-voce" data-src="nodo.lifecycle.html"><span class="n">05</span><b>Vita di un nodo</b><small>Generato, ancorato, giudicato, nel vault, studiato: chi lo cambia e quando.</small></button>
  <button type="button" class="ui-voce" data-src="quiz-qr.sequence.html"><span class="n">06</span><b>Quiz via QR</b><small>Telefono → live-server → gradeAnswer → verdetto; i report a chiusura.</small></button>

  <p class="ui-eyebrow">Progettazione</p>
  <button type="button" class="ui-voce" data-src="costi.workflow.html"><span class="n">07</span><b>Dove vanno i token</b><small>4 929 chiamate reali: quiz 53 %, Fase 3 10,7 %, giudice 9,7 %.</small></button>
  <button type="button" class="ui-voce" data-src="confronto-infomaniak.compare.html"><span class="n">08</span><b>Prima / dopo</b><small>Architettura con e senza Infomaniak: 4 rimossi, 1 confine cambiato.</small></button>
  <button type="button" class="ui-voce" data-src="fragilita.workflow.html"><span class="n">09</span><b>Fragilità</b><small>Dieci punti deboli con file e riga, e le decisioni da prendere.</small></button>

  <div class="ui-rail-piede">
    <div class="ui-azioni"><button type="button" class="ui-btn" id="apri">Schermo intero</button><button type="button" class="ui-btn" id="tema">Tema</button></div>
    <span>Ogni mappa ha temi, ricerca, capitoli guidati ed Export. Sorgenti e ricevute in docs/archify/.</span>
  </div>
</aside>
<main><iframe id="frame" title="Mappa"></iframe></main>

<script>
  const mappe = [...document.querySelectorAll('.ui-voce')];
  const frame = document.getElementById('frame');
  const radice = document.documentElement;

  function mostra(i) {
    mappe.forEach((m, k) => m.setAttribute('aria-selected', String(k === i)));
    frame.src = mappe[i].dataset.src;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
  }
  mappe.forEach((m, i) => m.addEventListener('click', () => mostra(i)));
  document.getElementById('apri').addEventListener('click', () => window.open(frame.src, '_blank'));
  document.getElementById('tema').addEventListener('click', () => {
    const chiaro = radice.dataset.theme === 'light';
    if (chiaro) delete radice.dataset.theme; else radice.dataset.theme = 'light';
    try { localStorage.setItem('atlante_tema', chiaro ? 'dark' : 'light'); } catch (e) {}
  });
  try { if (localStorage.getItem('atlante_tema') === 'light') radice.dataset.theme = 'light'; } catch (e) {}

  // Dentro ogni viewer (stessa origine): testata con più aria, bottoni della barra più piccoli.
  // Non tocca i file consegnati da Archify (le ricevute restano valide): è un foglio iniettato a caricamento.
  const RITOCCHI = `
    header { padding-right: 0 !important; margin-bottom: 1.6rem !important; }
    h1 { font-size: 1.3rem !important; line-height: 1.2 !important; margin: 0 0 .4rem !important; }
    .header-row { gap: 1rem !important; row-gap: .6rem !important; align-items: flex-start !important; }
    .toolbar { position: static !important; display: flex !important; justify-content: flex-end !important; flex-wrap: wrap !important; gap: .35rem !important; margin: .5rem 0 .9rem !important; }
    .toolbar button { padding: .3rem .55rem !important; font-size: .78rem !important; min-height: 1.9rem !important; }
    .toolbar #btn-preset, .toolbar #btn-motion { min-width: 0 !important; }
    .toolbar .toolbar-icon { width: .85rem !important; height: .85rem !important; }
  `;
  frame.addEventListener('load', () => {
    try {
      const d = frame.contentDocument; if (!d || !d.head) return;
      const s = d.createElement('style'); s.textContent = RITOCCHI; d.head.appendChild(s);
    } catch (e) { /* origine diversa (file://): il viewer resta com’è */ }
  });

  const avvio = parseInt(location.hash.slice(1), 10);
  mostra(avvio >= 1 && avvio <= mappe.length ? avvio - 1 : 0);
</script>
</body>
</html>
