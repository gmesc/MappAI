<!doctype html>
<html lang="it" class="ui">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlante MappAI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<!-- Regola 10: il sistema unico della UI. Si importa, non si copia. -->
<link rel="stylesheet" href="../../public/css/mappai-ui.css">
<style>
  /* Solo layout di pagina, tutto dai token: la pagina è una colonna, il pannello prende il resto. */
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--ui-fondo); color: var(--ui-testo); font-family: var(--ui-font); }
  .ui-testata, .ui-barra, .ui-capitoli-riga { width: 100%; }
  .ui-capitoli-riga { max-width: var(--ui-tetto); margin: 0 auto; padding: var(--ui-gap) 24px 0; display: flex; flex-wrap: wrap; gap: var(--ui-gap); }
  .ui-capitolo[hidden] { display: none; }
  .ui-pannello { flex: 1; width: calc(100% - 48px); display: flex; min-height: 0; }
  iframe { flex: 1; width: 100%; border: 0; background: var(--ui-pannello); border-radius: var(--ui-r-riquadro); }
</style>
</head>
<body>
<header class="ui-testata">
  <div>
    <p class="ui-eyebrow">Atlante · mappe generate dal codice · commit 2bc219a</p>
    <h1 class="ui-titolo">Atlante MappAI</h1>
    <p class="ui-sotto">Ogni mappa è validata contro il codice e ha temi, ricerca, capitoli guidati ed Export. Sorgenti e ricevute in docs/archify/.</p>
  </div>
  <div class="ui-chip-fila">
    <div class="ui-chip ok"><b>8</b><small>mappe</small></div>
    <div class="ui-chip mossa"><b>3</b><small>gruppi</small></div>
    <div class="ui-chip"><b>9</b><small>controlli l'una</small></div>
  </div>
</header>

<div class="ui-barra">
  <div class="ui-segmenti" role="tablist" aria-label="Gruppo">
    <button type="button" data-gruppo="tutti" aria-selected="true">Tutte</button>
    <button type="button" data-gruppo="struttura">Struttura</button>
    <button type="button" data-gruppo="flussi">Flussi</button>
    <button type="button" data-gruppo="progettazione">Progettazione</button>
  </div>
  <div class="ui-legenda">
    <span class="ok"><i></i>validata</span>
    <span class="mossa"><i></i>confronto</span>
  </div>
  <div class="ui-azioni">
    <button type="button" class="ui-btn" id="apri">Apri a schermo intero</button>
    <button type="button" class="ui-btn" id="tema">Tema</button>
  </div>
</div>

<div class="ui-capitoli-riga" role="tablist" aria-label="Mappe">
  <button type="button" class="ui-capitolo" data-gruppo="struttura" data-src="mappai.architecture.html"><span class="n">01</span>Architettura</button>
  <button type="button" class="ui-capitolo" data-gruppo="struttura" data-src="chiamata-llm.sequence.html"><span class="n">02</span>Una chiamata al LLM</button>
  <button type="button" class="ui-capitolo" data-gruppo="flussi" data-src="pdf-a-json.workflow.html"><span class="n">03</span>Dal PDF al JSON</button>
  <button type="button" class="ui-capitolo" data-gruppo="flussi" data-src="json-a-domanda.workflow.html"><span class="n">04</span>Dal JSON alla domanda aperta</button>
  <button type="button" class="ui-capitolo" data-gruppo="flussi" data-src="nodo.lifecycle.html"><span class="n">05</span>Vita di un nodo</button>
  <button type="button" class="ui-capitolo" data-gruppo="progettazione" data-src="costi.workflow.html"><span class="n">06</span>Dove vanno i token</button>
  <button type="button" class="ui-capitolo" data-gruppo="progettazione" data-src="confronto-infomaniak.compare.html"><span class="n">07</span>Prima / dopo<span class="conta"><span class="no">−4</span> ~1</span></button>
  <button type="button" class="ui-capitolo" data-gruppo="progettazione" data-src="fragilita.workflow.html"><span class="n">08</span>Fragilità</button>
</div>

<div class="ui-pannello"><iframe id="frame" title="Mappa"></iframe></div>

<script>
  const mappe = [...document.querySelectorAll('.ui-capitolo')];
  const gruppi = [...document.querySelectorAll('.ui-segmenti button')];
  const frame = document.getElementById('frame');
  const radice = document.documentElement;

  function mostra(i) {
    mappe.forEach((m, k) => m.setAttribute('aria-selected', String(k === i)));
    frame.src = mappe[i].dataset.src;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
  }
  function filtra(g) {
    gruppi.forEach(b => b.setAttribute('aria-selected', String(b.dataset.gruppo === g)));
    mappe.forEach(m => { m.hidden = g !== 'tutti' && m.dataset.gruppo !== g; });
  }
  mappe.forEach((m, i) => m.addEventListener('click', () => mostra(i)));
  gruppi.forEach(b => b.addEventListener('click', () => filtra(b.dataset.gruppo)));
  document.getElementById('apri').addEventListener('click', () => window.open(frame.src, '_blank'));
  document.getElementById('tema').addEventListener('click', () => {
    const chiaro = radice.dataset.theme === 'light';
    if (chiaro) delete radice.dataset.theme; else radice.dataset.theme = 'light';
    try { localStorage.setItem('atlante_tema', chiaro ? 'dark' : 'light'); } catch (e) {}
  });
  try { if (localStorage.getItem('atlante_tema') === 'light') radice.dataset.theme = 'light'; } catch (e) {}

  // Dentro ogni viewer (stessa origine): testata con più aria, bottoni della barra più piccoli.
  // Non tocca i file consegnati da Archify (le ricevute restano valide): è un foglio iniettato a caricamento.
  const RITOCCHI = `
    h1 { font-size: 1.3rem !important; line-height: 1.2 !important; }
    .header-row { gap: 1rem !important; row-gap: .6rem !important; align-items: flex-start !important; padding-right: .5rem !important; }
    .toolbar { gap: .35rem !important; flex-wrap: wrap !important; }
    .toolbar button { padding: .3rem .55rem !important; font-size: .78rem !important; min-height: 1.9rem !important; }
    .toolbar #btn-preset, .toolbar #btn-motion { min-width: 0 !important; }
    .toolbar .toolbar-icon { width: .85rem !important; height: .85rem !important; }
  `;
  frame.addEventListener("load", () => {
    try {
      const d = frame.contentDocument; if (!d || !d.head) return;
      const s = d.createElement("style"); s.textContent = RITOCCHI; d.head.appendChild(s);
    } catch (e) { /* origine diversa (file://): il viewer resta com’è */ }
  });

  const avvio = parseInt(location.hash.slice(1), 10);
  mostra(avvio >= 1 && avvio <= mappe.length ? avvio - 1 : 0);
</script>
</body>
</html>
