<!doctype html>
<meta charset="utf-8">
<title>Banco dei caratteri</title>
<!--
  banco-font.html — la prova che i caratteri ARRIVANO (18/8/26)

  Scritto a mano (non lo genera nessuno script: non ha una fonte da cui
  rigenerarsi, è una pagina di misura).

  Perché esiste: il catalogo e le metriche si provano in Node
  (tests/font-core.test.js), ma «il carattere si carica davvero» no — quello
  vive di @font-face, di percorsi relativi e di cascata, cioè delle tre cose
  che un test puro non vede. Qui si misura la LARGHEZZA del testo reso: se un
  file non arriva, il browser ripiega in silenzio su un carattere di sistema e
  a occhio non si distingue.

  ⚠️ La misura si fa col canvas, non con getComputedStyle né con la larghezza
  di un elemento: la regola `*` di style.css porta `!important`, quindi un
  font-family inline PERDE e tutte le misure tornano identiche (ci sono
  cascato: quattro caratteri diversi davano tutti 0,575).

  Si apre servendo public/ e andando su /dev/banco-font.html.
-->
<style>
    :root { --emoji-font: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; }
    body { margin: 24px; }
    table { border-collapse: collapse; margin-bottom: 24px; }
    th, td { text-align: left; padding: 4px 14px 4px 0; font-size: 13px; }
    th { border-bottom: 1px solid #cbd5e1; }
    .no { color: #b91c1c; font-weight: 700; }
    .si { color: #047857; font-weight: 700; }
    .campione { font-size: 26px; margin: 2px 0 14px; }
    .eti { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .08em; }
</style>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/mappai-font-core.js"></script>
<script src="../js/mappai-font.js"></script>

<h1 style="font-size:20px">Banco dei caratteri</h1>
<div id="tabella">misuro…</div>
<div id="campioni"></div>

<script>
    window.addEventListener('load', function () {
        var C = window.MappAIFontCore, F = window.MappAIFont;
        var ctx = document.createElement('canvas').getContext('2d');
        var PROVA = 'nnnnnnnnnnnnnnnnnnnn';          // 20 caratteri
        var FRASE = 'Il pane della zia è più buono — bdpq 0O1lI';
        var righe = [];

        // La controprova: un nome che non esiste dà il ripiego di sistema.
        // Se un carattere misura come lui, quel file NON è arrivato.
        ctx.font = '100px "QuestoFontNonEsiste"';
        var wRipiego = ctx.measureText(PROVA).width;

        Promise.all(C.elenco().map(function (f) {
            return document.fonts.load('100px "' + f.famiglia + '"').then(function (facce) {
                ctx.font = '100px "' + f.famiglia + '"';
                var w = ctx.measureText(PROVA).width;
                righe.push({
                    id: f.id, famiglia: f.famiglia, facce: facce.length,
                    reso: (w / PROVA.length / 100).toFixed(3),
                    arrivato: facce.length > 0 && Math.abs(w - wRipiego) > 1,
                    advance: f.advance, headAdvance: f.headAdvance, corsivo: f.corsivo
                });
            });
        })).then(function () {
            righe.sort(function (a, b) {
                return C.elenco().findIndex(x => x.id === a.id) - C.elenco().findIndex(x => x.id === b.id);
            });
            var h = '<table><tr><th>carattere</th><th>arrivato</th><th>«n» reso</th>' +
                '<th>advance</th><th>headAdvance</th><th>corsivo vero</th></tr>';
            righe.forEach(function (r) {
                h += '<tr><td>' + r.famiglia + '</td>' +
                    '<td class="' + (r.arrivato ? 'si' : 'no') + '">' + (r.arrivato ? 'sì' : 'NO') + '</td>' +
                    '<td>' + r.reso + '</td><td>' + r.advance + '</td><td>' + r.headAdvance + '</td>' +
                    '<td>' + (r.corsivo ? 'sì' : 'no') + '</td></tr>';
            });
            document.getElementById('tabella').innerHTML = h + '</table>' +
                '<p style="font-size:12px;color:#64748b">app: <b>' + F.attivo() +
                '</b> · feature ' + (F.accesa() ? 'accesa' : 'SPENTA (kill-switch)') + '</p>';

            // I campioni: il font si applica con la variabile, come fa l'app —
            // uno stile inline perderebbe contro il !important della regola `*`.
            var c = '';
            C.elenco().forEach(function (f) {
                c += '<div class="eti">' + f.famiglia + '</div>' +
                    '<div class="campione" style="--app-font:' + C.stackDi(f.id) + '">' + FRASE + '</div>';
            });
            document.getElementById('campioni').innerHTML = c;
            document.title = 'Banco dei caratteri — ' +
                righe.filter(function (r) { return r.arrivato; }).length + '/' + righe.length + ' arrivati';
        });
    });
</script>
