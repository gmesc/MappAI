<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness — «Domande a scelta»</title>
<!--
  Banco della SOLA superficie (`mappai-scelta-view.js` sul core puro): niente
  server, niente app. Serve a misurare quello che il pannello può misurare —
  che l'ANGOLO non compaia mai a schermo, che i bersagli siano da 44px, che il
  contatore dica il vero, che la consegna sotto il minimo chieda invece di
  vietare — e a guardare la pagina a larghezza di telefono.

  Aprire in un server statico:  /dev/scelta-harness.html
  ⚠️ I due file si caricano con un marcatore che cambia a ogni apertura: un
  banco che serve il codice dalla cache misura quello di ieri (trappola 4).
-->
<style>
  body { margin: 0; font: 13px/1.6 'Space Mono', ui-monospace, monospace; background: #eef2f7; color: #0f172a; }
  #esito { white-space: pre-wrap; background: #0f172a; color: #7dd3fc; padding: 14px 16px; }
  #esito b { color: #fca5a5; }
  .riga { display: flex; gap: 18px; align-items: flex-start; padding: 16px; flex-wrap: wrap; }
  .telefono { width: 390px; height: 720px; border: 10px solid #0f172a; border-radius: 26px; overflow: hidden; background: #fafbff; }
  .col h3 { font: 700 12px 'Space Mono', monospace; margin: 0 0 8px; color: #475569; letter-spacing: .06em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="esito">in corso…</div>
<div class="riga">
  <div class="col"><h3>Domande aperte (telefono)</h3><div class="telefono" id="host-open"></div></div>
  <div class="col"><h3>Scelta multipla (telefono)</h3><div class="telefono" id="host-mc"></div></div>
  <div class="col"><h3>Esito dopo la consegna</h3><div class="telefono" id="host-esito"></div></div>
</div>

<script>
  /* i due moduli VERI, senza cache */
  var v = '?v=' + Date.now();
  document.write('<script src="../js/mappai-scelta-core.js' + v + '"><\/script>');
  document.write('<script src="../js/mappai-scelta-view.js' + v + '"><\/script>');
</script>

<script>
(function () {
'use strict';
var log = [], ko = 0;
function ok(c, m) { log.push((c ? '  ok  ' : '  KO  ') + m); if (!c) ko++; }
var S = window.MappAIScelta, V = window.MappAISceltaView;

/* I fogli: quelli che la pipeline scrive dal 19/8 — uno per angolo, con il ramo
   dichiarato sull'item — più uno vecchio, che il ramo non ce l'ha. */
var FOGLI = [
  { titolo: 'Domande-aperte-Il Clima-causa', angle: 'causa', tipo: 'open', items: [
    { question: 'Perché l\'aria si muove dalle alte alle basse pressioni?', ramo: 'Atmosfera', livello: 'base' },
    { question: 'Che cosa provoca le correnti oceaniche?', ramo: 'Oceani', livello: 'ponte', guide: 'Collega vento e temperatura.' }
  ] },
  { titolo: 'Domande-aperte-Il Clima-definizione', angle: 'definizione', tipo: 'open', items: [
    { question: 'Che cos\'è il clima?', ramo: 'Basi', livello: 'base' },
    { question: 'Definisci la corrente del Golfo', ramo: 'Oceani' },
    /* la STESSA domanda del foglio «causa», scritta senza apostrofo: due angoli
       sullo stesso ramo la ripetono, ed è il caso che la dedup deve prendere */
    { question: 'Perché l aria si muove dalle alte alle basse pressioni?', ramo: 'Atmosfera' }
  ] },
  { titolo: 'Domande-aperte-Il Clima-eccezione', tipo: 'open', items: [
    { question: 'Quando la regola dei venti costanti non vale?' }
  ] }
];
var FOGLI_MC = [
  { titolo: 'Quiz-MC-Il Clima-conseguenza', angle: 'conseguenza', tipo: 'mc', items: [
    { q: 'Che cosa comporta lo scioglimento dei ghiacci?', options: ['Il livello del mare sale', 'Il vento cambia verso', 'Le nuvole spariscono'], correctIndex: 0, ramo: 'Oceani' },
    { q: 'Che effetto ha la corrente del Golfo sull\'Europa?', options: ['La raffredda', 'La riscalda', 'Non la tocca'], correctIndex: 1, ramo: 'Oceani' }
  ] }
];

var pool = S.pubblico(S.mescola(S.poolDaFogli(FOGLI), 'volpe-03'));
var poolMc = S.pubblico(S.poolDaFogli(FOGLI_MC));
var salvate = [], consegne = 0;

var API = V.monta(document.getElementById('host-open'), {
  pool: pool, cfg: { minimo: 3 }, stato: {},
  onCambia: function (id, r) { salvate.push({ id: id, r: r }); },
  onConsegna: function () { consegne++; },
  chiedi: function () { return Promise.resolve(true); }
});
V.monta(document.getElementById('host-mc'), { pool: poolMc, cfg: { minimo: 1, autovalutazione: true }, stato: {} });

/* ── che cosa si misura ─────────────────────────────────────────────────── */
var host = document.getElementById('host-open');
var testo = host.textContent;

log.push('— l\'angolo non si vede, ed è il punto dell\'attività');
var ANG = S.ANGOLI().concat(['misto']);
var trapelati = ANG.filter(function (a) { return new RegExp('\\b' + a + '\\b', 'i').test(testo); });
ok(!trapelati.length, 'nessuna chiave d\'angolo a schermo' + (trapelati.length ? ' → ' + trapelati : ''));
ok(!/qp-set|foglio|Domande-aperte/i.test(testo), 'nessun nome di file a schermo');
ok(pool.every(function (v) { return !('angle' in v); }), 'e il pool servito non ce l\'ha nemmeno');

log.push('— l\'elenco');
var carte = host.querySelectorAll('.sc-q');
ok(carte.length === 5, '5 domande: sei meno il doppione fra i due fogli → ' + carte.length);
var rami = [].map.call(host.querySelectorAll('.sc-ramo'), function (x) { return x.textContent; });
ok(rami[rami.length - 1] === 'Altre domande', 'il gruppo senza ramo sta in CODA → ' + JSON.stringify(rami));
ok([].every.call(host.querySelectorAll('.sc-body'), function (b) { return b.hidden; }),
   'le risposte sono chiuse: l\'elenco resta leggibile anche con quaranta domande');

log.push('— prendere una domanda');
var prima = carte[0];
prima.querySelector('.sc-take').click();
ok(!prima.querySelector('.sc-body').hidden, 'un tocco apre il campo della risposta');
ok(prima.querySelector('.sc-take').getAttribute('aria-pressed') === 'true', 'e lo dice anche a chi non vede il colore (aria-pressed)');
ok(!!prima.querySelector('.sc-ta'), 'domanda aperta → casella di scrittura');
ok(prima.querySelectorAll('.sc-chip').length === 4, 'quattro chip «perché questa?»');
ok(salvate.length === 1, 'la scelta si salva subito (non si aspetta la pausa)');

log.push('— scelta ≠ scritta');
var c1 = document.getElementById('host-open').querySelector('.sc-cnt').textContent;
ok(/Scelte: 1/.test(c1) && /scritte: 0/.test(c1), 'presa ma non scritta → ' + c1.replace(/\s+/g, ' '));
var ta = prima.querySelector('.sc-ta');
ta.value = 'Perché la differenza di pressione la spinge'; ta.dispatchEvent(new Event('input'));
ok(/scritte: 1/.test(document.getElementById('host-open').querySelector('.sc-cnt').textContent), '…e ora conta come scritta');

log.push('— lasciare una domanda non butta quello che ho scritto');
prima.querySelector('.sc-take').click();
ok(prima.querySelector('.sc-body').hidden, 'il secondo tocco la lascia');
ok(/Scelte: 0/.test(document.getElementById('host-open').querySelector('.sc-cnt').textContent), 'e non conta più');
prima.querySelector('.sc-take').click();
ok(prima.querySelector('.sc-ta').value.indexOf('pressione') > 0, 'riprendendola, la risposta è dov\'era');

log.push('— la consegna sotto il minimo CHIEDE, non vieta');
document.querySelector('#host-open .sc-go').click();
setTimeout(function () {
  ok(consegne === 1, 'con la conferma, consegna comunque → ' + consegne);

  log.push('— i bersagli si toccano col pollice (44px)');
  var piccoli = [].filter.call(host.querySelectorAll('button'), function (b) {
    var r = b.getBoundingClientRect();
    return r.height && r.height < 44;
  }).map(function (b) { return b.className + ' ' + Math.round(b.getBoundingClientRect().height); });
  ok(!piccoli.length, 'nessun bottone sotto i 44px' + (piccoli.length ? ' → ' + piccoli.slice(0, 4) : ''));

  log.push('— scelta multipla: cambia SOLO il campo della risposta');
  var hm = document.getElementById('host-mc');
  hm.querySelector('.sc-take').click();
  var q1 = hm.querySelector('.sc-q');
  ok(!q1.querySelector('.sc-ta'), 'niente casella di scrittura');
  ok(q1.querySelectorAll('.sc-opt').length === 3, 'tre opzioni da toccare');
  ok(q1.querySelectorAll('.sc-chip').length >= 4 + 3, 'i chip ci sono lo stesso, più i tre dell\'autovalutazione');
  q1.querySelectorAll('.sc-opt')[1].click();
  ok(q1.querySelectorAll('.sc-opt')[1].getAttribute('aria-checked') === 'true', 'l\'opzione scelta si dichiara');
  ok(/scritte: 1/.test(hm.querySelector('.sc-cnt').textContent), 'una scelta È una risposta');
  /* ⚠️ La prima stesura cercava «✓» nel testo: ma quello è il segno della card
     PRESA, non una soluzione — il banco falliva per il motivo sbagliato
     (trappola 5). La domanda giusta è se la soluzione sia ARRIVATA: nel pool
     pubblico non c'è, e a schermo nessuna opzione è marcata prima del tocco. */
  ok(poolMc.every(function (v) { return !('giusta' in v); }), 'la soluzione non arriva nemmeno al telefono');
  var q2 = hm.querySelectorAll('.sc-q')[1];
  q2.querySelector('.sc-take').click();
  ok([].every.call(q2.querySelectorAll('.sc-opt'), function (b) { return b.getAttribute('aria-checked') === 'false'; }),
     'aprendo una domanda nuova nessuna opzione è già segnata');

  log.push('— l\'esito');
  var st = { risposte: {} };
  var vero = S.mescola(S.poolDaFogli(FOGLI), 'volpe-03');
  st.risposte[vero[0].id] = { testo: 'x', chip: 'so' };
  st.risposte[vero[1].id] = { testo: 'y', chip: 'so' };
  V.mostraEsito(document.getElementById('host-esito'), {
    profilo: S.profilo(vero, st), evitata: S.evitata(vero, st, 'volpe-03'),
    cfg: { reveal: true, perche_no: true, secondo_giro: true },
    onPercheNo: function () { }, onSecondoGiro: function () { }
  });
  var he = document.getElementById('host-esito').textContent;
  ok(/Consegnato/.test(he), 'dice che è consegnato');
  ok(/Causa|Definizione|Eccezione/i.test(he), 'QUI l\'angolo si vede: è il senso del reveal');
  ok(/Non hai preso nessuna domanda/.test(he), 'e dice quale taglio non ha voluto');
  ok(/Prova a rispondere anche a questa/.test(he), 'il secondo giro riapre UNA domanda');

  document.getElementById('esito').innerHTML = log.join('\n') + (ko ? '\n\n<b>FALLITI: ' + ko + '</b>' : '\n\nTUTTO OK');
}, 30);
}());
</script>
</body>
</html>
