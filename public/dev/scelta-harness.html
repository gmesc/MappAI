<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness — «Domande a scelta»</title>
<!--
  Banco della SOLA superficie (`mappai-scelta-view.js` sul core puro): niente
  server, niente app. Misura quello che il pannello può misurare — che l'ANGOLO
  non compaia mai a schermo, i bersagli da 44px, il contatore, il percorso a tre
  passi — e mostra la pagina a larghezza di telefono.

  ⚠️ I dati finti hanno la FORMA VERA di un vault generato con «Più set per
  angolo»: 7 angoli × 3 rami × 2 varianti = 42 domande grezze. Con cinque
  domande inventate il campionamento non sarebbe esercitato affatto.

  Aprire in un server statico:  /dev/scelta-harness.html
  ⚠️ I due file si caricano con un marcatore che cambia a ogni apertura: un
  banco che serve il codice dalla cache misura quello di ieri (trappola 4).
-->
<style>
  body { margin: 0; font: 13px/1.6 'Space Mono', ui-monospace, monospace; background: #eef2f7; color: #0f172a; }
  #esito { white-space: pre-wrap; background: #0f172a; color: #7dd3fc; padding: 14px 16px; }
  #esito b { color: #fca5a5; }
  .riga { display: flex; gap: 18px; align-items: flex-start; padding: 16px; flex-wrap: wrap; }
  .telefono { width: 390px; height: 720px; border: 10px solid #0f172a; border-radius: 26px; overflow: hidden; background: #fafbff; }
  .col h3 { font: 700 12px 'Space Mono', monospace; margin: 0 0 8px; color: #475569; letter-spacing: .06em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="esito">in corso…</div>
<div class="riga">
  <div class="col"><h3>① aree</h3><div class="telefono" id="host-aree"></div></div>
  <div class="col"><h3>② leggi e scegli</h3><div class="telefono" id="host-scegli"></div></div>
  <div class="col"><h3>③ rispondi (aperte)</h3><div class="telefono" id="host-rispondi"></div></div>
  <div class="col"><h3>③ rispondi (scelta multipla)</h3><div class="telefono" id="host-mc"></div></div>
  <div class="col"><h3>esito</h3><div class="telefono" id="host-esito"></div></div>
</div>

<script>
  var v = '?v=' + Date.now();
  document.write('<script src="../js/mappai-scelta-core.js' + v + '"><\/script>');
  document.write('<script src="../js/mappai-scelta-view.js' + v + '"><\/script>');
</script>

<script>
(function () {
'use strict';
var log = [], ko = 0;
function ok(c, m) { log.push((c ? '  ok  ' : '  KO  ') + m); if (!c) ko++; }
var S = window.MappAIScelta, V = window.MappAISceltaView;

/* ── i dati, nella forma che la pipeline produce ─────────────────────────── */
var ANG = S.ANGOLI();                       /* i sette tagli */
var RAMI = ['Atmosfera', 'Oceani', 'Basi'];
var TESTI = {
  Atmosfera: ['il movimento dell\'aria fra alte e basse pressioni', 'la formazione delle nuvole'],
  Oceani: ['la corrente del Golfo', 'lo scioglimento dei ghiacci'],
  Basi: ['la differenza fra tempo e clima', 'le fasce climatiche']
};
/* ⚠️ I testi NON contengono la parola dell'angolo — sono scritti come li
   scriverebbe l'AI, cioè col taglio dentro la domanda e non nel nome. La prima
   stesura del banco li componeva come «Domanda sul causa — …» e la prova
   «nessuna chiave d'angolo a schermo» falliva per colpa dei DATI, non della
   view (trappola 5: un test può fallire per il motivo sbagliato). */
var FORME = {
  definizione: function (x) { return 'Che cos\'è ' + x + '?'; },
  causa: function (x) { return 'Perché avviene ' + x + '?'; },
  conseguenza: function (x) { return 'Che cosa comporta ' + x + '?'; },
  esempio: function (x) { return 'Racconta un caso concreto di ' + x; },
  confronto: function (x) { return 'Che differenza c\'è fra ' + x + ' e il resto del capitolo?'; },
  eccezione: function (x) { return 'Quando ' + x + ' non vale?'; },
  applicazione: function (x) { return 'Come useresti ' + x + ' per spiegare un fatto nuovo?'; }
};
function fogli(tipo) {
  return ANG.map(function (a) {
    return { titolo: (tipo === 'mc' ? 'Quiz-MC' : 'Domande-aperte') + '-Il Clima-' + a, angle: a, tipo: tipo,
      items: [].concat.apply([], RAMI.map(function (r) {
        return [0, 1].map(function (k) {
          var forma = FORME[a] || function (x) { return 'Domanda su ' + x; };
          var it = { question: forma(TESTI[r][k]) + (k ? ' (seconda versione)' : ''),
                     ramo: r, livello: k ? 'ponte' : 'base' };
          if (tipo === 'mc') { it.options = ['Prima opzione', 'Seconda opzione', 'Terza opzione']; it.correctIndex = k; }
          return it;
        });
      })) };
  });
}
var GREZZO = S.poolDaFogli(fogli('open'));
var POOL = S.pubblico(S.unaPerAngolo(GREZZO, 'volpe-03'));
var POOL_MC = S.pubblico(S.unaPerAngolo(S.poolDaFogli(fogli('mc')), 'volpe-03'));
/* il pool PICCOLO: un ramo solo — il percorso non deve partire */
var POOL_MINI = S.pubblico(S.poolDaFogli([{ titolo: 'Verifica di ottobre', tipo: 'open',
  items: [{ question: 'Una domanda' }, { question: 'Un\'altra domanda' }] }]));

log.push('— la scala, e il taglio che la rende leggibile');
ok(GREZZO.length === 42, '42 domande grezze (7 angoli × 3 rami × 2 varianti) → ' + GREZZO.length);
ok(POOL.length === 21, 'campionate a 21: una per (area × angolo) → ' + POOL.length);
ok(POOL.every(function (x) { return !('angle' in x); }), 'e al telefono l\'angolo non arriva');

/* ── ① le aree ───────────────────────────────────────────────────────────── */
var salvate = [], consegne = 0;
var statoA = {};
var api = V.monta(document.getElementById('host-aree'), {
  pool: POOL, cfg: { minimo: 3, minimoAree: 2 }, stato: statoA,
  onCambia: function (id, r, st) { salvate.push(id); },
  onConsegna: function () { consegne++; },
  chiedi: function () { return Promise.resolve(true); }
});
var hA = document.getElementById('host-aree');
log.push('— ① si comincia dalle aree');
ok(statoA.fase === 'aree', 'la fase di partenza è «aree» → ' + statoA.fase);
var carteA = hA.querySelectorAll('.sc-q');
ok(carteA.length === 3, 'una card per macro-area → ' + carteA.length);
ok(/7 domande/.test(hA.textContent), 'ognuna dice quante domande porta (7, non 35)');
ok(!ANG.some(function (a) { return new RegExp('\\b' + a + '\\b', 'i').test(hA.textContent); }),
   'nessuna chiave d\'angolo a schermo');
carteA[1].querySelector('.sc-take').click();
ok(/1 argomenti/.test(hA.querySelector('.sc-cnt').textContent) && /7 domande da leggere/.test(hA.querySelector('.sc-cnt').textContent),
   'il contatore dice quante domande comporta la scelta → ' + hA.querySelector('.sc-cnt').textContent.replace(/\s+/g, ' '));
hA.querySelector('.sc-go').click();     /* sotto il minimo: chiede, e la risposta finta è «sì» */

setTimeout(function () {
  ok(statoA.fase === 'scegli', 'sotto il minimo CHIEDE e lascia passare → ' + statoA.fase);

  /* ── ② leggi e scegli ─────────────────────────────────────────────────── */
  /* ⚠️ `aree` da solo non basta: a decidere la schermata è `fase`, non la
     presenza delle aree — è la stessa cosa che fa ritrovare il proprio posto a
     chi rientra. Senza, il banco ripartiva dal passo ①. */
  var statoB = { aree: ['Oceani', 'Basi'], fase: 'scegli' };
  V.monta(document.getElementById('host-scegli'), {
    pool: POOL, cfg: { minimo: 3, minimoAree: 2 }, stato: statoB,
    onCambia: function (id) { salvate.push(id); }, chiedi: function () { return Promise.resolve(true); }
  });
  var hB = document.getElementById('host-scegli');
  log.push('— ② si legge solo quello che si è scelto');
  ok(statoB.fase === 'scegli', 'entra nel passo ②');
  var carteB = hB.querySelectorAll('.sc-q');
  ok(carteB.length === 14, 'due aree = 14 domande (non 70) → ' + carteB.length);
  ok([].every.call(hB.querySelectorAll('.sc-body'), function (b) { return b.hidden; }),
     'le domande sono chiuse: si apre quella che si sta considerando');
  ok(!hB.querySelector('.sc-ta'), 'nessuna casella di scrittura: qui non si risponde');
  ok(/Cambia argomenti/.test(hB.textContent), 'e si può tornare alle aree');

  log.push('— il giudizio di RICHIAMO, anche su una domanda che non prendo');
  var uno = carteB[0], due = carteB[1];
  uno.querySelector('.sc-take').click();
  ok(!uno.querySelector('.sc-body').hidden, 'il tocco APRE (non prende)');
  ok(uno.querySelectorAll('.sc-chip').length === 4, 'quattro chip di attivazione');
  ok(/non mi accende niente/.test(uno.textContent), 'fra cui «non mi accende niente»');
  ok(!!uno.querySelector('.sc-prendi'), 'e un bottone a parte per prenderla');
  uno.querySelectorAll('.sc-chip')[3].click();          /* niente */
  ok(/Lette: 1/.test(hB.querySelector('.sc-cnt').textContent), 'una letta, e non l\'ho presa → ' +
     hB.querySelector('.sc-cnt').textContent.replace(/\s+/g, ' '));
  ok(/scelte: 0/.test(hB.querySelector('.sc-cnt').textContent), 'giudicare non è prendere');
  ok(uno.classList.contains('letta'), 'la card dice che è stata letta');
  due.querySelector('.sc-take').click();
  due.querySelectorAll('.sc-chip')[0].click();          /* subito */
  due.querySelector('.sc-prendi').click();
  ok(/Lette: 2/.test(hB.querySelector('.sc-cnt').textContent) && /scelte: 1/.test(hB.querySelector('.sc-cnt').textContent),
     'due lette, una presa → ' + hB.querySelector('.sc-cnt').textContent.replace(/\s+/g, ' '));
  ok(Object.keys(statoB.letture).length === 2 && Object.keys(statoB.risposte).length === 1,
     'e i due registri restano separati: letture 2, risposte 1');

  /* prendo altre due, poi vado a rispondere */
  carteB[2].querySelector('.sc-take').click(); carteB[2].querySelector('.sc-prendi').click();
  carteB[3].querySelector('.sc-take').click(); carteB[3].querySelector('.sc-prendi').click();
  hB.querySelector('.sc-go').click();

  setTimeout(function () {
    /* ── ③ rispondi ────────────────────────────────────────────────────── */
    log.push('— ③ una domanda alla volta');
    ok(statoB.fase === 'rispondi', 'entra nel passo ③ → ' + statoB.fase);
    var statoC = JSON.parse(JSON.stringify(statoB));
    V.monta(document.getElementById('host-rispondi'), {
      pool: POOL, cfg: { minimo: 3, minimoAree: 2, autovalutazione: true }, stato: statoC,
      onCambia: function () { }, onConsegna: function () { consegne++; },
      chiedi: function () { return Promise.resolve(true); }
    });
    var hC = document.getElementById('host-rispondi');
    ok(hC.querySelectorAll('.sc-dom').length === 1, 'una domanda a schermo, non sei');
    ok(/1 \/ 3/.test(hC.querySelector('.sc-nav__n').textContent), 'il contatore dice quanto manca → ' + hC.querySelector('.sc-nav__n').textContent);
    ok(!!hC.querySelector('.sc-ta'), 'e QUI c\'è la casella di scrittura');
    ok(/Leggendola avevi detto/.test(hC.textContent), 'il giudizio dato leggendo si mostra, non si richiede');
    ok(!!hC.querySelector('.sc-go'), 'la consegna è raggiungibile dalla PRIMA domanda, non solo dall\'ultima');
    var nav = hC.querySelectorAll('.sc-nav__b');
    ok(nav[0].disabled && !nav[1].disabled, 'sulla prima, «indietro» è spento');
    var ta = hC.querySelector('.sc-ta');
    ta.value = 'La corrente del Golfo porta acqua calda verso l\'Europa'; ta.dispatchEvent(new Event('input'));
    nav[1].click();
    ok(/2 \/ 3/.test(hC.querySelector('.sc-nav__n').textContent), 'avanti va alla seconda');
    hC.querySelectorAll('.sc-nav__b')[0].click();
    ok(hC.querySelector('.sc-ta').value.indexOf('Golfo') > 0, 'tornando indietro la risposta è dov\'era');

    log.push('— scelta multipla: cambia SOLO il campo della risposta');
    var statoM = { aree: ['Oceani'], fase: 'rispondi', risposte: {}, letture: {} };
    statoM.risposte[POOL_MC.filter(function (x) { return x.ramo === 'Oceani'; })[0].id] = {};
    V.monta(document.getElementById('host-mc'), { pool: POOL_MC, cfg: { minimo: 1, minimoAree: 1 }, stato: statoM });
    var hM = document.getElementById('host-mc');
    ok(!hM.querySelector('.sc-ta'), 'niente casella di scrittura');
    ok(hM.querySelectorAll('.sc-opt').length === 3, 'tre opzioni da toccare');
    ok(POOL_MC.every(function (x) { return !('giusta' in x); }), 'la soluzione non arriva al telefono');
    hM.querySelectorAll('.sc-opt')[1].click();
    ok(hM.querySelectorAll('.sc-opt')[1].getAttribute('aria-checked') === 'true', 'l\'opzione scelta si dichiara');

    log.push('— su una mappa piccola il percorso NON parte');
    var statoMini = {};
    V.monta(document.createElement('div'), { pool: POOL_MINI, cfg: {}, stato: statoMini });
    ok(statoMini.fase === 'scegli', 'un ramo solo: si atterra sull\'elenco → ' + statoMini.fase);

    log.push('— le misure che devono restare vere');
    var tutti = [hA, hB, hC, hM];
    var trapelati = [];
    tutti.forEach(function (h) {
      ANG.forEach(function (a) { if (new RegExp('\\b' + a + '\\b', 'i').test(h.textContent) && trapelati.indexOf(a) < 0) trapelati.push(a); });
    });
    ok(!trapelati.length, 'nessuna chiave d\'angolo in nessuno dei passi' + (trapelati.length ? ' → ' + trapelati : ''));
    var piccoli = [];
    tutti.forEach(function (h) {
      [].forEach.call(h.querySelectorAll('button'), function (b) {
        var r = b.getBoundingClientRect();
        if (r.height && r.height < 44) piccoli.push(b.className + ' ' + Math.round(r.height));
      });
    });
    ok(!piccoli.length, 'nessun bottone sotto i 44px' + (piccoli.length ? ' → ' + piccoli.slice(0, 4) : ''));
    var sbordi = 0;
    tutti.forEach(function (h) {
      var d = h.getBoundingClientRect();
      [].forEach.call(h.querySelectorAll('*'), function (e) {
        var r = e.getBoundingClientRect();
        if (r.width && (r.right > d.right + 0.5 || r.left < d.left - 0.5)) sbordi++;
      });
    });
    ok(!sbordi, 'nessuno sbordo orizzontale a 390px → ' + sbordi);

    log.push('— l\'esito');
    var vero = S.unaPerAngolo(GREZZO, 'volpe-03');
    var st = { aree: ['Oceani', 'Basi'], risposte: {}, letture: {} };
    var oce = S.filtraPerAree(vero, ['Oceani']);
    st.risposte[oce[0].id] = { testo: 'x' }; st.letture[oce[0].id] = { chip: 'subito' };
    st.letture[oce[1].id] = { chip: 'niente' };
    V.mostraEsito(document.getElementById('host-esito'), {
      profilo: S.profilo(S.filtraPerAree(vero, st.aree), st),
      evitata: S.evitata(S.filtraPerAree(vero, st.aree), st, 'volpe-03'),
      cfg: { reveal: true, perche_no: true, secondo_giro: true },
      onPercheNo: function () { }, onSecondoGiro: function () { }
    });
    var he = document.getElementById('host-esito').textContent;
    ok(/Consegnato/.test(he), 'dice che è consegnato');
    ok(ANG.some(function (a) { return new RegExp(a, 'i').test(he); }), 'QUI l\'angolo si vede: è il senso del reveal');
    ok(/Prova a rispondere anche a questa/.test(he), 'il secondo giro riapre UNA domanda');

    /* ⚠️ Il banco ha portato hB fino al passo ③ premendo «Comincia a
       rispondere»: a schermo la colonna ② mostrerebbe la ③. Si rimonta in fase
       «scegli», così le cinque colonne fanno vedere davvero i cinque momenti —
       è uno strumento per guardare, non solo per contare. */
    V.monta(document.getElementById('host-scegli'), {
      pool: POOL, cfg: { minimo: 3, minimoAree: 2 },
      stato: JSON.parse(JSON.stringify(Object.assign({}, statoB, { fase: 'scegli' })))
    });
    /* idem la colonna ①, che il banco ha portato al passo ② premendo «Vai alle
       domande» per provare che sotto il minimo chiede */
    V.monta(document.getElementById('host-aree'), {
      pool: POOL, cfg: { minimo: 3, minimoAree: 2 },
      stato: { fase: 'aree', aree: ['Oceani'] }
    });
    document.getElementById('esito').innerHTML = log.join('\n') + (ko ? '\n\n<b>FALLITI: ' + ko + '</b>' : '\n\nTUTTO OK');
  }, 30);
}, 30);
}());
</script>
</body>
</html>
