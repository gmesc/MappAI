<script>
/* ── 3. cattura ─────────────────────────────────────────────────────────────
 * Le console si APRONO davvero (con dati finti) e lo schema si legge dai due
 * hook che i moduli espongono: MappAITeach._consSchema e MappAICabina._schema.
 * Fra un passo e l'altro si aspetta la catena di promesse: i dati arrivano
 * «dal disco» e la colonna si riempie da sé. */
const log = m => { document.getElementById('log').innerHTML += '\n' + m; };
const attendi = ms => new Promise(r => setTimeout(r, ms));
const CATTURATE = [];

function aggiungi(id, nome, gruppo, nota, src, schema) {
  if (!schema) { log('<span class="ko">✗ ' + id + ': schema vuoto</span>'); return; }
  const s = JSON.parse(JSON.stringify(schema, (k, v) => typeof v === 'function' ? undefined : v));
  CATTURATE.push({ id, nome, gruppo, nota, src, tipo: 'schema', schema: s });
  log('<span class="ok">✓ ' + nome + '</span> — ' + (s.nav || []).length + ' voci di navigazione');
}

/* preme una voce di navigazione della console aperta, come farebbe un clic.
   Si cerca nell'ULTIMO velo: gli overlay si impilano, e il primo del documento
   è quello vecchio (era il difetto della prima cattura). */
function nav(sel) {
  const ov = [...document.querySelectorAll('.mm-overlay')].pop();
  if (!ov) { log('<span class="ko">nessuna console aperta</span>'); return null; }
  const voci = [...ov.querySelectorAll('.mm-nav__v')];
  const v = typeof sel === 'function' ? voci.filter(sel)[0]
    : voci.filter(x => x.dataset.nav === sel)[0];
  if (!v) { log('<span class="ko">voce ' + sel + ' non trovata (ci sono: ' +
    voci.map(x => x.dataset.nav).join(', ') + ')</span>'); return null; }
  v.click(); return v;
}
function chiudi() { document.querySelectorAll('.mm-overlay').forEach(o => o.remove()); }

async function cattura() {
  document.getElementById('log').textContent = 'cattura in corso…';

  /* ① INSEGNA */
  chiudi();
  window.MappAITeach.openConsole();
  await attendi(200);
  aggiungi('app-insegna', 'INSEGNA — elenco delle mappe', 'App (vere)',
    'La console vera di INSEGNA con la colonna piena: le mappe vengono dal disco, filtrate dal chip.',
    'public/js/mappai-landing-teach.js:2003 (_consSchema)', window.MappAITeach._consSchema());

  /* la mappa: l'id è quello del vault sul disco (v:…) o del progetto (p:…) */
  nav(x => /^[vp]:/.test(x.dataset.nav || '')); await attendi(220);
  aggiungi('app-insegna-mappa', 'INSEGNA — mappa scelta (materiali)', 'App (vere)',
    'La schermata di riferimento: gli avvii con la classe + i materiali del vault raggruppati per genere.',
    'public/js/mappai-landing-teach.js:2003', window.MappAITeach._consSchema());

  for (const [v, nome, nota] of [
    ['live', 'INSEGNA — attività LIVE', 'Avvio di quiz e tutor + i report già prodotti, con classe e materia.'],
    ['stampabili', 'INSEGNA — stampabili', 'Gli stessi generi, ma sull\'unione delle mappe del contesto: in più la colonna Mappa.'],
    ['lavagna', 'INSEGNA — lavagna', 'Le due scelte di avvio, il foglio credenziali e le sessioni da riprendere.']
  ]) { nav(v); await attendi(200); aggiungi('app-insegna-' + v, nome, 'App (vere)', nota,
        'public/js/mappai-landing-teach.js:2003', window.MappAITeach._consSchema()); }

  chiudi();

  /* ② Cabina — una superficie per vista */
  const VOCI = (window.MappAICabina && window.MappAICabina.VOCI) || [];
  for (const v of VOCI) {
    const id = v.id;
    if (!id) continue;                       // le intestazioni di gruppo non sono viste
    chiudi();
    window.openCabina(id); await attendi(150);
    aggiungi('app-cabina-' + id, 'CABINA — ' + (v.testo || id), 'App (vere)',
      'Vista della Cabina (io e l\'app), montata dal modulo vero.',
      'public/js/mappai-cabina.js:833 (_schema)', window.MappAICabina._schema());
  }
  chiudi();

  document.getElementById('out').value = JSON.stringify(CATTURATE, null, 1);
  log('\n<b>' + CATTURATE.length + ' superfici catturate.</b>');
  window.__CATTURATE = CATTURATE;
}
cattura().catch(e => log('<span class="ko">ERRORE: ' + e.message + '</span>'));
</script>
