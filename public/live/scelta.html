<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MappAI · Domande a scelta</title>
<!-- SPACE MONO È LOCALE (15/9/2026), come in index.html dal 18/8: lo serve il
     server LAN da public/fonts/ (allowlist `/public/fonts/`). Prima arrivava da
     fonts.googleapis.com e in aula senza rete — o dietro il filtro della scuola —
     il telefono dell'allievo cadeva sul monospace di sistema senza dire niente.
     Le EMOJI sono locali anche loro (packet 0108, 16/10/2026): niente più Noto da
     fonts.googleapis.com. Il font «MappAI Emoji» (public/fonts/MappAIEmoji.ttf) porta le 27
     dell'identità e le emoji che questa pagina scrive (⚠️, 💡…); sui motori WebKit le
     disegna come immagini mappai-emoji-prova.js. Le altre: emoji di sistema. -->
<style>
  @font-face { font-family:'Space Mono'; font-style:normal; font-weight:400;
    src:url('../fonts/SpaceMono-Regular.ttf') format('truetype'); font-display:swap; }
  @font-face { font-family:'Space Mono'; font-style:normal; font-weight:700;
    src:url('../fonts/SpaceMono-Bold.ttf') format('truetype'); font-display:swap; }
  /* Le 27 emoji che NON sono decorazione — l'identità dell'allievo e i codici
     d'accesso dei gruppi — e, dal packet 0108, le emoji che le pagine degli
     allievi scrivono: un font locale di circa 350 KB ritagliato da Noto
     (tools/font/emoji-sottoinsieme.py). Sta PRIMA di Noto nello stack: quelle
     si vedono anche senza rete e uguali su ogni telefono; le altre sono quelle
     di sistema. */
  @font-face { font-family:'MappAI Emoji'; font-style:normal; font-weight:400;
    src:url('../fonts/MappAIEmoji.ttf?v=0108') format('truetype'); font-display:swap; }
</style>
<style>
  :root { --ink:#0f172a; --indigo:#4f46e5; --slate:#64748b; --line:#cbd5e1; --emoji:'MappAI Emoji','Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji'; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:var(--live-font, 'Space Mono',var(--emoji),monospace); color:var(--ink); background:#fafbff; }
  /* il login (le sei righe di mappai-accesso-allievi.js, 0134) porta da sé la veste puntinata; l'attività no —
     là dentro comanda il CSS che la view si porta dietro */
  #login { display:none; }
  #login.on { display:block; }
  #app { display:none; height:100%; }
  #app.on { display:block; }
  h1 { font-size:19px; margin:6px 0 2px; }
  label { display:block; font-size:11px; font-weight:700; color:var(--slate); margin:10px 0 4px; }
  input { width:100%; border:1px solid #cbd5e1; border-radius:10px; padding:10px 12px; font:inherit; font-size:16px; }
</style>
<!-- 0099: prova il font emoji locale su questo dispositivo; dove non si legge, --emoji ripiega sulle emoji di sistema -->
<script src="/public/js/mappai-emoji-prova.js?v=0108" defer></script>
</head>
<body>
  <!-- l'accesso: progetto, classe, nome dell'attività, emoji e numero (o nome del gruppo), Entra — mappai-accesso-allievi.js -->
  <section id="login" class="on"></section>

  <div id="app"></div>

<script src="/public/js/mappai-font-core.js?v=0112"></script>
<script src="/public/js/mappai-live-font.js?v=0112"></script>
<script src="/public/js/mappai-live-core.js"></script>
<script src="/public/js/mappai-accesso-allievi.js?v=0134"></script>
<script src="/public/js/mappai-scelta-core.js"></script>
<script src="/public/js/mappai-quiz-mc-view.js?v=0112"></script>
<script src="/public/js/mappai-scelta-view.js"></script>
<script>
  var LC = window.MappAILiveCore, SC = window.MappAIScelta, SV = window.MappAISceltaView;
  var QS = new URLSearchParams(location.search);
  var TOKEN = QS.get('s') || '';
  var DEV_KEY = 'mappai_live_device';
  var deviceId = localStorage.getItem(DEV_KEY);
  if (!deviceId) { deviceId = 'd_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem(DEV_KEY, deviceId); }
  var $ = function (id) { return document.getElementById(id); };
  function api(p, opts) { return fetch(p, opts).then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }, function () { return { status: r.status, body: null }; }); }); }
  function post(p, obj) { return api(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) }); }

  var SESS = null, IDENT = null, POOL = [], CFG = null, STATO = null, VISTA = null, VERDETTI = {};

  var A = window.MappAIAccesso;
  function boot() {
    if (!TOKEN) { A.monta($('login'), { errore: 'Link non valido. Riscansiona il QR.' }); return; }
    api('/api/session?s=' + encodeURIComponent(TOKEN)).then(function (r) {
      if (r.status !== 200) { A.monta($('login'), { errore: 'Sessione non raggiungibile.' }); return; }
      SESS = r.body;
      MappAILiveFont.daSessione(SESS);   // il carattere scelto dal docente (mappai-live-font.js)
      // 0134: le sei righe; la riga 3 è il nome dell'attività del report («Domande aperte · Causa»), non più un titolo fisso
      A.monta($('login'), { progetto: SESS.name, classe: SESS.className, attivita: SESS.attivita || SESS.activity,
        modo: SESS.loginMode === 'group' ? 'gruppo-nome' : 'singolo', emoji: SESS.emojiSet || (LC ? LC.EMOJI_SET : []), entra: entra });
    }).catch(function () { A.monta($('login'), { errore: 'Connessione assente. Sei sulla rete della classe?' }); });
  }

  function entra(scelta) {
    var payload = { token: TOKEN, deviceId: deviceId };
    if (scelta.nick) payload.nick = scelta.nick;
    else { payload.emojiKey = scelta.emojiKey; payload.num = String(scelta.num).padStart(2, '0'); }
    post('/api/join', payload).then(function (r) {
      if (r.status !== 200) {
        A.errore(r.body && r.body.error === 'identity-taken' ? 'Già in uso su un altro dispositivo.'
          : (r.body && r.body.error === 'not-in-roster' ? 'Non sei nell\'elenco della classe.' : 'Accesso non riuscito.'));
        return;
      }
      IDENT = payload;
      // il pool arriva GIÀ campionato e senza angolo: il server serve solo le
      // domande di questo studente (una per area × taglio)
      POOL = r.body.pool || [];
      CFG = r.body.cfg || null;
      STATO = r.body.stato || {};
      /* i verdetti li tiene il SERVER: al rientro tornano di qui, e le domande
         già corrette restano chiuse */
      VERDETTI = r.body.verdetti || {};
      $('login').classList.remove('on'); $('app').classList.add('on');
      monta();
    });
  };

  // ── il trasporto: lo stato INTERO a ogni salvataggio ──────────────────────
  // La view accumula e chiama dopo una pausa (600ms): qui si spedisce quello
  // che c'è. Lo stato è un percorso, non una risposta — aree, a che punto sono,
  // che cosa mi ha acceso ogni domanda letta, e le risposte.
  // `dopoConsegna` marca quello che si scrive NELLA schermata di esito: senza,
  // il server riaprirebbe la consegna a ogni tasto premuto nel «perché no?».
  function salva(stato, dopoConsegna, id) {
    return post('/api/stato', Object.assign({
      token: TOKEN, deviceId: deviceId, stato: stato, dopoConsegna: !!dopoConsegna, id: id || ''
    }, IDENT)).then(function (r) {
      /* «Correggi subito»: il verdetto lo calcola il server e torna col
         salvataggio — al telefono non arriva mai una soluzione da custodire */
      if (r.status === 200 && r.body && r.body.verdetto && id) {
        VERDETTI[id] = r.body.verdetto;
        if (VISTA) VISTA.verdetto(id, r.body.verdetto);
      }
      return r;
    });
  }
  // il campo del «perché no?» non ha debounce nella view (si scrive una riga
  // sola): lo mette qui chi lo spedisce
  var attesaPn = null;
  function salvaPn() {
    if (attesaPn) clearTimeout(attesaPn);
    attesaPn = setTimeout(function () { attesaPn = null; salva(STATO, true); }, 600);
  }

  /* 0116, gate del 21/10: la scheda da salvare è una pagina del server (/api/my-sheet), la stessa
     del quiz LIVE: tutte le domande e le risposte, e la stampa si apre da sola (il nome del file
     è il titolo della pagina). La finestra si apre SUBITO, nel gesto del tocco; se il telefono
     la nega, si va lì in questa stessa pagina. */
  function apriScheda() {
    var chi = IDENT && IDENT.nick ? ('&nick=' + encodeURIComponent(IDENT.nick))
      : ('&emojiKey=' + encodeURIComponent((IDENT && IDENT.emojiKey) || '') + '&num=' + encodeURIComponent((IDENT && IDENT.num) || ''));
    var url = '/api/my-sheet?s=' + encodeURIComponent(TOKEN) + chi + '&deviceId=' + encodeURIComponent(deviceId);
    var finestra = null;
    try { finestra = window.open(url, '_blank'); } catch (e) { finestra = null; }
    if (!finestra) location.href = url;
  }

  function monta() {
    VISTA = SV.monta($('app'), {
      pool: POOL, cfg: CFG, stato: STATO, verdetti: VERDETTI,
      onCambia: function (id, risposta, stato) { STATO = stato; salva(stato, false, id); },
      onConsegna: function (stato) {
        STATO = stato;
        post('/api/finish', Object.assign({ token: TOKEN, deviceId: deviceId, stato: stato }, IDENT)).then(function (r) {
          if (r.status !== 200) { alert('Consegna non riuscita. Riprova.'); return; }
          SV.mostraEsito($('app'), {
            cfg: CFG, profilo: r.body.profilo, evitata: r.body.evitata,
            onSalva: apriScheda,   // 0116: il 💾 della schermata finale (solo in modalità semplice)
            onPercheNo: function (idQ, why) {
              STATO.evitata = { id: idQ, why: why };
              salvaPn();
            },
            onSecondoGiro: function (v) {
              // riapre UNA domanda: si torna alle risposte con quella presa.
              // ⚠️ Se viene da un'area che non aveva scelto, l'area va aggiunta:
              // il passo ③ mostra solo le domande delle aree attive, e senza
              // questo la domanda riaperta non comparirebbe da nessuna parte.
              STATO.risposte = STATO.risposte || {};
              if (!STATO.risposte[v.id]) STATO.risposte[v.id] = {};
              STATO.aree = STATO.aree || [];
              if (v.ramo && STATO.aree.length && STATO.aree.indexOf(v.ramo) < 0) STATO.aree.push(v.ramo);
              STATO.fase = 'rispondi';
              salva(STATO).then(monta);
            }
          });
        });
      }
    });
  }

  boot();
</script>
</body>
</html>
