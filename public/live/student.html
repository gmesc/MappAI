<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- «Aggiungi a Home» → l'app si apre senza barre del browser (schermo intero su iPhone) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MappAI">
<title>MappAI Live — Quiz</title>
<!-- Stesso font dell'app (fallback monospace se la LAN è offline) + emoji Android -->
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
  :root { --emoji: 'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif; }
  /* emoji Android (Noto) nello stack universale — regola globale MappAI */
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent;
      font-family: 'Space Mono', var(--emoji), ui-monospace, monospace; }
  html, body { height: 100%; }
  body { background: #fafbff; color: #0f172a; display: flex; flex-direction: column; overflow: hidden; }
  button { cursor: pointer; border: 0; font: inherit; }
  .dotbg { background-image: radial-gradient(#ddd6fe 1px, transparent 1px); background-size: 24px 24px; }
  .emoji { font-family: var(--emoji); }

  /* ── Sezioni ── */
  section { flex: 1; display: none; flex-direction: column; min-height: 0; }
  section.on { display: flex; }

  /* ── Login ── */
  #login { align-items: center; justify-content: flex-start; gap: 14px; padding: 26px 20px;
           text-align: center; overflow-y: auto; }
  #login h1 { font-size: 21px; font-weight: 700; margin-top: 6px; }
  #login .name { color: #4f46e5; font-weight: 700; font-size: 15px; }
  .lbl { font-size: 12px; font-weight: 700; color: #475569; align-self: flex-start;
         width: min(360px, 90vw); margin: 6px auto 0; }
  #login input { width: min(360px, 90vw); padding: 13px 16px; border-radius: 12px;
                 border: 2px solid #e2e8f0; background: #fff; color: #0f172a;
                 font-size: 17px; text-align: center; outline: none; }
  #login input:focus { border-color: #6366f1; }
  #emoji-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
                width: min(360px, 90vw); }
  .egrid-btn { aspect-ratio: 1; border-radius: 14px; border: 2px solid #e2e8f0; background: #fff;
               font-size: 30px; display: flex; align-items: center; justify-content: center; }
  .egrid-btn.sel { border-color: #4f46e5; background: #eef2ff; transform: scale(1.05); }
  #enter { width: min(360px, 90vw); padding: 14px; border-radius: 12px; margin-top: 4px;
           background: #4f46e5; color: #fff; font-size: 17px; font-weight: 700; }
  .err { color: #dc2626; font-size: 13px; min-height: 18px; }

  /* ── Lobby ── */
  #lobby { align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
  #lobby .big { font-size: 64px; }
  #lobby h2 { font-size: 20px; font-weight: 700; }
  #lobby p { color: #64748b; font-size: 14px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; background: #eef2ff; color: #4f46e5;
           border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 15px; }

  /* ── Player ── */
  #player { }
  /* safe-area: con viewport-fit=cover il contenuto va sotto notch/bordi arrotondati
     → padding minimo garantito + inset del dispositivo (iPhone con notch/isola) */
  #pbar { display: flex; align-items: center; gap: 10px;
          padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
          background: #fff; border-bottom: 1px solid #e2e8f0; }
  #pcount { font-size: 13px; font-weight: 700; color: #334155; }
  #pprogress { flex: 1; height: 8px; background: #f1f5f9; border-radius: 999px; overflow: hidden; }
  #pprogress i { display: block; height: 100%; background: #4f46e5; width: 0; transition: width .2s; }
  #ptimer { font-size: 13px; font-weight: 700; color: #64748b; }
  #ptimer.low { color: #dc2626; }
  #sync { font-size: 16px; }
  #sync.ok { color: #16a34a; } #sync.wait { color: #d97706; } #sync.err { color: #dc2626; }

  #qwrap { flex: 1; overflow-y: auto;
           padding: 26px max(24px, env(safe-area-inset-right)) 26px max(24px, env(safe-area-inset-left)); }
  /* domanda + bottone Ascolta accanto */
  .q-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 22px; }
  #qtext { font-size: 24px; font-weight: 700; line-height: 1.45; flex: 1; }
  #qtext:empty { display: none; }
  /* bottone TTS (altoparlante) — grande, area tap comoda */
  .tts { flex: 0 0 auto; width: 56px; min-height: 56px; border-radius: 14px; border: 2px solid #e2e8f0;
         background: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; color: #4f46e5; }
  .tts:active, .tts.on { background: #eef2ff; border-color: #4f46e5; }
  #qread { align-self: flex-start; }
  /* opzione = riga: bottone-testo (seleziona) + bottone Ascolta */
  .opt-row { display: flex; align-items: stretch; gap: 8px; margin-bottom: 12px; }
  .opt { flex: 1; text-align: left; padding: 18px 18px; border-radius: 14px; border: 2px solid #e2e8f0;
         background: #fff; color: #0f172a; font-size: 20px; line-height: 1.35; }
  .opt.sel { border-color: #4f46e5; background: #eef2ff; }
  .tf-row { display: flex; gap: 12px; }
  .tf-btn { flex: 1; padding: 26px 8px; border-radius: 14px; border: 2px solid #e2e8f0; background: #fff;
            font-size: 22px; font-weight: 800; }
  .tf-btn.sel-t { border-color: #16a34a; background: #dcfce7; color: #166534; }
  .tf-btn.sel-f { border-color: #dc2626; background: #fee2e2; color: #991b1b; }
  /* Esito immediato (20/8, «Correggi subito»): compare SOTTO la domanda, non
     in un modale — chi risponde dal telefono non deve perdere di vista quello
     che ha appena scelto. */
  .verd { margin-top: 16px; border-radius: 12px; padding: 12px 14px; font-size: 16px; line-height: 1.45; }
  .verd-ok { background: #dcfce7; border: 2px solid #16a34a; color: #14532d; }
  .verd-ko { background: #fee2e2; border: 2px solid #dc2626; color: #7f1d1d; }
  .verd b { font-weight: 800; }
  .verd .sp { display: block; margin-top: 6px; font-size: 14px; color: #334155; }
  #qopen { width: 100%; min-height: 130px; padding: 14px 16px; border-radius: 12px; border: 2px solid #e2e8f0;
           font-size: 19px; outline: none; resize: vertical; }
  #qopen:focus { border-color: #6366f1; }
  /* bottone schermo intero nella barra */
  #pfull { flex: 0 0 auto; background: none; color: #64748b; font-size: 19px; padding: 2px 6px; }
  /* Landscape (telefono coricato): comprime l'altezza ma tiene margini laterali
     ampi (con notch/isola sul lato → safe-area sinistra/destra abbondante) */
  @media (orientation: landscape) and (max-height: 560px) {
    #qwrap { padding: 14px max(34px, env(safe-area-inset-right)) 14px max(34px, env(safe-area-inset-left)); }
    .q-head { margin-bottom: 12px; }
    #qtext { font-size: 21px; }
    .opt { font-size: 18px; padding: 13px 15px; }
    .opt-row { margin-bottom: 8px; }
    .tf-btn { padding: 16px 8px; }
    #pbar { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: 8px; }
    #pfoot { padding-top: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    #pfoot button { padding: 10px 10px; }
  }

  #pfoot { display: flex; gap: 10px;
           padding: 12px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
           background: #fff; border-top: 1px solid #e2e8f0; }
  #pfoot button { border-radius: 12px; padding: 14px 10px; font-weight: 800; font-size: 15px; }
  #back { background: #f1f5f9; color: #334155; flex: 0 0 auto; padding-left: 18px; padding-right: 18px; }
  #back:disabled { opacity: .4; }
  #skip { background: #fff; color: #b45309; border: 2px solid #fde68a; flex: 0 0 auto; }
  #next { background: #4f46e5; color: #fff; flex: 1; }

  /* ── Done ── */
  #done { align-items: center; justify-content: center; gap: 16px; padding: 26px; text-align: center; }
  #done .big { font-size: 64px; }
  #done h2 { font-size: 22px; font-weight: 700; }
  #done p { color: #64748b; font-size: 14px; max-width: 340px; }
  #done .recap { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px 22px;
                 font-size: 15px; }
  #done button { width: min(320px, 84vw); padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; }
  #review { background: #f1f5f9; color: #334155; }
  #submit { background: #16a34a; color: #fff; }
  /* Dashboard risultato studente */
  #done { overflow-y: auto; }
  #result-dash { text-align: left; margin-top: 6px; }
  #result-score { text-align: center; margin-bottom: 14px; }
  #result-score .pct { font-size: 54px; font-weight: 800; line-height: 1; }
  #result-score .sub { font-size: 13px; color: #64748b; margin-top: 4px; }
  #result-list { max-height: 52vh; overflow-y: auto; }
  .rq { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .rq-q { font-weight: 700; font-size: 14px; margin-bottom: 6px; line-height: 1.35; }
  .rq-a { font-size: 13px; color: #334155; margin-top: 2px; }
  .rq-c { font-size: 13px; color: #16a34a; margin-top: 2px; font-weight: 700; }
  .rq-e { font-size: 12px; color: #64748b; margin-top: 7px; padding-top: 7px; border-top: 1px solid #f1f5f9; line-height: 1.4; }
  #result-save { background: #4f46e5; color: #fff; margin-top: 4px; }
  @media print { #review, #submit, #result-save, header { display: none !important; } #result-list { max-height: none; overflow: visible; } }
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<section id="login" class="on dotbg">
  <h1>MappAI Live</h1>
  <div class="name emoji" id="login-activity"></div>
  <div class="lbl">La tua classe</div>
  <input id="in-class" autocomplete="off" placeholder="es. 2ª A">
  <div class="lbl">La tua emoji</div>
  <div id="emoji-grid"></div>
  <div class="lbl">Il tuo numero</div>
  <input id="in-num" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" placeholder="es. 07">
  <button id="enter">Entra</button>
  <div class="err" id="login-err"></div>
</section>

<!-- ── LOBBY ── -->
<section id="lobby">
  <div class="big emoji" id="lobby-emoji">✅</div>
  <h2>Sei dentro!</h2>
  <div class="badge"><span class="emoji" id="lobby-who"></span></div>
  <p id="lobby-msg">Aspetta che l'insegnante avvii le domande…</p>
</section>

<!-- ── PLAYER ── -->
<section id="player">
  <div id="pbar">
    <span id="pcount">1 / 1</span>
    <div id="pprogress"><i></i></div>
    <button id="pfull" type="button" aria-label="Schermo intero" title="Schermo intero">⛶</button>
    <span id="ptimer"></span>
    <span id="sync" class="ok">●</span>
  </div>
  <div id="qwrap">
    <div class="q-head">
      <div id="qtext"></div>
      <button id="qread" class="tts" type="button" aria-label="Ascolta la domanda">🔊</button>
    </div>
    <div id="qbody"></div>
  </div>
  <div id="pfoot">
    <button id="back">←</button>
    <button id="skip">Salta</button>
    <button id="next">Avanti</button>
  </div>
</section>

<!-- ── DONE ── -->
<section id="done">
  <div class="big" id="done-emoji">🎉</div>
  <h2 id="done-title">Hai finito!</h2>
  <div class="recap" id="done-recap"></div>
  <p id="done-msg">Puoi ancora rivedere e cambiare le risposte finché l'insegnante non chiude.</p>
  <button id="review">Rivedi le risposte</button>
  <button id="submit">Consegna</button>
  <!-- Dashboard risultato (dopo la Consegna, se il docente ha attivato le soluzioni) -->
  <div id="result-dash" style="display:none;width:min(560px,92vw)">
    <div id="result-score"></div>
    <div id="result-list"></div>
    <button id="result-save" type="button">💾 Salva il mio risultato</button>
  </div>
</section>

<script src="/public/js/mappai-live-core.js"></script>
<script>
(function () {
  'use strict';
  var LC = window.MappAILiveCore;
  var QS = new URLSearchParams(location.search);
  var TOKEN = QS.get('s') || '';
  var DEV_KEY = 'mappai_live_device';
  var deviceId = localStorage.getItem(DEV_KEY);
  if (!deviceId) { deviceId = 'd_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem(DEV_KEY, deviceId); }

  var $ = function (id) { return document.getElementById(id); };
  function show(id) { document.querySelectorAll('section').forEach(function (s) { s.classList.toggle('on', s.id === id); }); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  // ── Sintesi vocale (TTS del browser, offline, zero server) ────────────────
  var _ttsOn = null;
  function speak(text) {
    try {
      if (!('speechSynthesis' in window)) return;
      var t = String(text || '').trim(); if (!t) return;
      speechSynthesis.cancel();               // interrompe la lettura precedente
      var u = new SpeechSynthesisUtterance(t);
      u.lang = 'it-IT'; u.rate = 0.95;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  // bottone altoparlante: legge `getText()` (o la stringa), senza far scattare
  // la selezione dell'opzione (stopPropagation).
  function ttsBtn(getText) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'tts'; b.setAttribute('aria-label', 'Ascolta'); b.textContent = '🔊';
    b.onclick = function (ev) { ev.stopPropagation(); speak(typeof getText === 'function' ? getText() : getText); };
    return b;
  }
  // riga opzione = bottone-testo (seleziona) + bottone Ascolta accanto
  function optionRow(cls, text, onSelect) {
    var row = document.createElement('div'); row.className = 'opt-row';
    var b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = text;
    b.onclick = onSelect;
    row.appendChild(b); row.appendChild(ttsBtn(text));
    return row;
  }
  // testo da leggere per la domanda corrente
  function questionSpeech(q) {
    if (!q) return '';
    if (q.kind === 'tf') return q.proposed || q.text || '';
    return q.text || '';
  }

  var SESS = null;          // meta sessione
  var IDENT = null;         // { emojiKey, num }
  var QUESTIONS = [];       // pubbliche (senza soluzioni)
  var ANSWERS = {};         // idx → { choice/text/skipped, ms }
  var LSK = null;           // chiave localStorage risposte
  var i = 0;                // domanda corrente
  var qStart = 0;           // ts di visualizzazione domanda corrente
  var chosenEmoji = null;
  var pollTimer = null, timerTimer = null;

  function api(p, opts) {
    return fetch(p, opts).then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }, function () { return { status: r.status, body: null }; }); });
  }
  function post(p, obj) { return api(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) }); }

  // ── Boot: leggi la sessione, costruisci il login ──
  function boot() {
    if (!TOKEN) { $('login-err').textContent = 'Link non valido. Riscansiona il QR.'; return; }
    api('/api/session?s=' + encodeURIComponent(TOKEN)).then(function (r) {
      if (r.status !== 200) { $('login-err').textContent = 'Sessione non raggiungibile.'; return; }
      SESS = r.body;
      $('login-activity').innerHTML = esc(SESS.activity || 'Quiz') + (SESS.className ? ' · ' + esc(SESS.className) : '');
      if (SESS.className) $('in-class').value = SESS.className;
      buildEmojiGrid(SESS.emojiSet || (LC ? LC.EMOJI_SET : []));
    }).catch(function () { $('login-err').textContent = 'Connessione assente. Sei sulla rete della classe?'; });
  }

  function buildEmojiGrid(set) {
    var g = $('emoji-grid'); g.innerHTML = '';
    set.forEach(function (e) {
      var b = document.createElement('button');
      b.className = 'egrid-btn emoji'; b.textContent = e.emoji; b.setAttribute('data-key', e.key);
      b.setAttribute('aria-label', e.label || e.key);
      b.onclick = function () {
        chosenEmoji = e.key;
        g.querySelectorAll('.egrid-btn').forEach(function (x) { x.classList.remove('sel'); });
        b.classList.add('sel');
      };
      g.appendChild(b);
    });
  }

  function classMatch(a, b) {
    if (!LC) return true;
    return LC.normalizeClassName(a).replace(/\s/g, '') === LC.normalizeClassName(b).replace(/\s/g, '');
  }

  $('enter').onclick = function () {
    var cls = ($('in-class').value || '').trim();
    var num = ($('in-num').value || '').replace(/\D/g, '');
    $('login-err').textContent = '';
    if (!cls) { $('login-err').textContent = 'Scrivi la tua classe.'; return; }
    if (SESS && SESS.className && !classMatch(cls, SESS.className)) { $('login-err').textContent = 'Questa attività è per la classe ' + SESS.className + '.'; return; }
    if (!chosenEmoji) { $('login-err').textContent = 'Tocca la tua emoji.'; return; }
    if (num === '') { $('login-err').textContent = 'Scrivi il tuo numero.'; return; }
    post('/api/join', { token: TOKEN, emojiKey: chosenEmoji, num: num, deviceId: deviceId }).then(function (r) {
      if (r.status === 404) { $('login-err').textContent = 'Emoji e numero non trovati per questa classe.'; return; }
      if (r.status === 409) { $('login-err').textContent = 'Sei già collegato su un altro dispositivo. Chiedi all\'insegnante di sbloccarti.'; return; }
      if (r.status !== 200) { $('login-err').textContent = 'Errore di accesso. Riprova.'; return; }
      IDENT = { emojiKey: chosenEmoji, num: LC ? LC.pad2(num) : num };
      QUESTIONS = r.body.questions || [];
      LSK = 'mappai_live_ans::' + TOKEN + '::' + (LC ? LC.identityKey(IDENT.emojiKey, IDENT.num) : IDENT.emojiKey + IDENT.num);
      ANSWERS = mergeAnswers(r.body.answers || {}, loadLocal());
      /* ⚠️ I verdetti tornano DENTRO le risposte (il server li scrive lì): senza
         questa riga una ricarica azzerava il punteggio, sbloccava le domande già
         corrette e mandava la pagina a ritentare all'infinito una POST che il
         server rifiuta. `scelta.html` lo fa già dal suo `join`. */
      Object.keys(ANSWERS).forEach(function (k) {
        if (ANSWERS[k] && ANSWERS[k].verdetto) VERDETTI[k] = ANSWERS[k].verdetto;
      });
      enterPhase(r.body.phase, r.body.displayName);
    }).catch(function () { $('login-err').textContent = 'Connessione assente.'; });
  };

  function loadLocal() { try { return JSON.parse(localStorage.getItem(LSK) || '{}'); } catch (e) { return {}; } }
  function saveLocal() { try { localStorage.setItem(LSK, JSON.stringify(ANSWERS)); } catch (e) {} }
  // fonde le risposte del server con quelle locali (locale vince se più recente)
  function mergeAnswers(server, local) {
    var out = {}; Object.keys(server || {}).forEach(function (k) { out[k] = server[k]; });
    Object.keys(local || {}).forEach(function (k) {
      if (!out[k] || (local[k].updatedAt || 0) >= (out[k].updatedAt || 0)) out[k] = local[k];
    });
    return out;
  }

  function enterPhase(phase, displayName) {
    if (phase === 'closed') { showDone(true); return; }
    if (phase === 'running') { startPlayer(); return; }
    // lobby
    $('lobby-emoji').textContent = (LC && LC.emojiByKey(IDENT.emojiKey) || {}).emoji || '✅';
    $('lobby-who').textContent = ((LC && LC.emojiByKey(IDENT.emojiKey) || {}).emoji || '') + ' ' + IDENT.num + (displayName && !/^\p{Emoji}/u.test(displayName) ? ' · ' + displayName : '');
    show('lobby');
    pollPhase();
  }

  function pollPhase() {
    clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      api('/api/session?s=' + encodeURIComponent(TOKEN)).then(function (r) {
        if (r.status !== 200) return;
        SESS = r.body;
        if (SESS.phase === 'running') { clearInterval(pollTimer); startPlayer(); }
        else if (SESS.phase === 'closed') { clearInterval(pollTimer); showDone(true); }
      });
    }, 2500);
  }

  // ── Player ──
  function startPlayer() {
    show('player');
    i = firstUnanswered();
    renderQuestion();
    // poll leggero per intercettare la chiusura del docente
    clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      api('/api/session?s=' + encodeURIComponent(TOKEN)).then(function (r) {
        if (r.status === 200) { SESS = r.body; if (SESS.phase === 'closed') { clearInterval(pollTimer); flushCurrent(); showDone(true); } updateTimer(); }
      });
    }, 5000);
    updateTimer();
    clearInterval(timerTimer);
    timerTimer = setInterval(updateTimer, 1000);
  }

  function firstUnanswered() {
    for (var k = 0; k < QUESTIONS.length; k++) { if (!ANSWERS[QUESTIONS[k].idx]) return k; }
    return 0;
  }

  function updateTimer() {
    var el = $('ptimer');
    if (!SESS || !SESS.endsAt) { el.textContent = ''; return; }
    var ms = new Date(SESS.endsAt).getTime() - Date.now();
    if (ms <= 0) { el.textContent = '0:00'; el.classList.add('low'); return; }
    var s = Math.floor(ms / 1000); var m = Math.floor(s / 60);
    el.textContent = m + ':' + String(s % 60).padStart(2, '0');
    el.classList.toggle('low', ms < 60000);
  }

  function renderQuestion() {
    var q = QUESTIONS[i];
    qStart = Date.now();
    $('pcount').textContent = (i + 1) + ' / ' + QUESTIONS.length + puntiTesto();
    $('pprogress').firstElementChild.style.width = Math.round((i) / QUESTIONS.length * 100) + '%';
    $('back').disabled = (i === 0);
    // bottone «Ascolta la domanda» → legge testo/frase della domanda corrente
    $('qread').onclick = function () { speak(questionSpeech(q)); };
    var giaCorretta = !!VERDETTI[q.idx];
    var body = $('qbody');
    body.innerHTML = '';
    var a = ANSWERS[q.idx] || {};

    if (q.kind === 'mc') {
      $('qtext').innerHTML = esc(q.text);
      (q.options || []).forEach(function (opt, oi) {
        body.appendChild(optionRow('opt' + (a.choice === oi ? ' sel' : ''), opt, function () { setChoice(oi); }));
      });
    } else if (q.kind === 'tf') {
      $('qtext').innerHTML = esc(q.proposed || q.text);
      var row = document.createElement('div'); row.className = 'tf-row';
      var bt = document.createElement('button'); bt.className = 'tf-btn' + (a.choice === true ? ' sel-t' : ''); bt.textContent = 'VERO';
      var bf = document.createElement('button'); bf.className = 'tf-btn' + (a.choice === false ? ' sel-f' : ''); bf.textContent = 'FALSO';
      bt.onclick = function () { setChoice(true); }; bf.onclick = function () { setChoice(false); };
      row.appendChild(bt); row.appendChild(bf); body.appendChild(row);
    } else { // open
      $('qtext').innerHTML = esc(q.text);
      // Timeline (008): domanda evento→anno → input numerico dedicato.
      if (q.expects === 'year') {
        var yi = document.createElement('input'); yi.id = 'qopen'; yi.type = 'text';
        yi.setAttribute('inputmode', 'numeric'); yi.setAttribute('pattern', '[0-9]*');
        yi.autocomplete = 'off'; yi.placeholder = 'Anno (es. 1947)';
        yi.style.cssText = 'width:100%;padding:12px 14px;border-radius:12px;border:2px solid #e2e8f0;font-family:inherit;font-size:16px;';
        if (a.text) yi.value = a.text;
        body.appendChild(yi);
      } else {
        var ta = document.createElement('textarea'); ta.id = 'qopen'; ta.placeholder = 'Scrivi la tua risposta…';
        if (a.text) ta.value = a.text;
        body.appendChild(ta);
      }
    }

    // Timeline (008): indizio dalla fonte. 'always' = sempre visibile;
    // 'onrequest' = bottone 💡 che rivela e registra l'uso; 'never' = niente.
    if (q.hint && SESS && SESS.hintMode !== 'never') {
      var hintWrap = document.createElement('div');
      hintWrap.style.cssText = 'margin-top:12px;';
      if (SESS.hintMode === 'always') {
        hintWrap.innerHTML = '<div style="font-size:13px;color:#475569;font-style:italic;background:#f8fafc;border-left:3px solid #cbd5e1;padding:8px 12px;border-radius:8px;">💡 ' + esc(q.hint) + '</div>';
      } else {
        var already = !!(a.hintUsed);
        var btn = document.createElement('button');
        btn.textContent = already ? '💡 Indizio' : '💡 Mostra indizio';
        btn.style.cssText = 'background:#f1f5f9;border:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-family:inherit;font-size:14px;color:#475569;';
        var hintText = document.createElement('div');
        hintText.style.cssText = 'display:' + (already ? 'block' : 'none') + ';margin-top:8px;font-size:13px;color:#475569;font-style:italic;background:#f8fafc;border-left:3px solid #cbd5e1;padding:8px 12px;border-radius:8px;';
        hintText.textContent = q.hint;
        btn.onclick = function () {
          hintText.style.display = 'block';
          var aa = ANSWERS[q.idx] || {}; aa.hintUsed = true; ANSWERS[q.idx] = aa;
          saveLocal();
        };
        hintWrap.appendChild(btn); hintWrap.appendChild(hintText);
      }
      body.appendChild(hintWrap);
    }

    /* già corretta: si rivede l'esito e non si ripensa (il verdetto è stato dato) */
    if (giaCorretta) { mostraVerdetto(q.idx); bloccaDomanda(); }
  }

  /* ── «Correggi subito» ────────────────────────────────────────────────────
     Il verdetto lo calcola il SERVER e arriva con la risposta: qui non c'è
     nessuna soluzione da custodire, e non ci sarà mai. Se il docente non ha
     acceso la leva, `VERDETTI` resta vuoto e non cambia niente. */
  /* ⚠️ I verdetti NON vivono qui: il server li scrive dentro `answers` e il
     join li riconsegna. Tenerli solo in memoria voleva dire che un
     ricaricamento sbloccava le domande già corrette e azzerava il contatore. */
  var VERDETTI = {};        // idx → { esito, giusta, spiegazione }
  function puntiTesto() {
    if (!SESS || !SESS.feedbackImmediato) return '';
    var date = 0, ok = 0;
    Object.keys(VERDETTI).forEach(function (k) { date++; if (VERDETTI[k].esito === 'right') ok++; });
    return date ? '  ·  ' + ok + '/' + date : '';
  }
  function mostraVerdetto(idx) {
    var v = VERDETTI[idx]; if (!v) return;
    var vecchio = $('qbody').querySelector('.verd'); if (vecchio) vecchio.remove();
    var d = document.createElement('div');
    d.className = 'verd ' + (v.esito === 'right' ? 'verd-ok' : 'verd-ko');
    d.setAttribute('role', 'status');
    d.innerHTML = (v.esito === 'right' ? '<b>Giusto</b>' : '<b>Sbagliato</b>') +
      (v.giusta ? ' — corretta: <b>' + esc(v.giusta) + '</b>' : '') +
      (v.spiegazione ? '<span class="sp">' + esc(v.spiegazione) + '</span>' : '');
    $('qbody').appendChild(d);
    $('pcount').textContent = (i + 1) + ' / ' + QUESTIONS.length + puntiTesto();
  }
  /* ⚠️ Una domanda già corretta non si ripensa: correggere e poi lasciar
     cambiare la risposta trasformerebbe il punteggio in un contatore di
     tentativi. Si spengono i comandi, non si nasconde la domanda. */
  function bloccaDomanda() {
    $('qbody').querySelectorAll('button, input, textarea').forEach(function (el) {
      if (el.closest && el.closest('.verd')) return;
      el.disabled = true; el.style.opacity = '.75';
    });
    /* «Salta» vive nel piè, fuori da #qbody: senza questa riga cancellava una
       risposta già corretta (il server ora la rifiuta comunque, ma un comando
       che risponde 409 è un comando inerte — inv. 21) */
    var sk = $('skip'); if (sk) { sk.disabled = true; sk.style.opacity = '.55'; }
  }

  // mc/tf: selezione immediata + autosave
  function setChoice(val) {
    var q = QUESTIONS[i];
    accumMs();
    var a = ANSWERS[q.idx] || {}; a.choice = val; delete a.skipped; ANSWERS[q.idx] = a;
    renderQuestionSelState(q, val);
    saveAnswer(q.idx);
  }
  function renderQuestionSelState(q, val) {
    if (q.kind === 'mc') { $('qbody').querySelectorAll('.opt').forEach(function (b, oi) { b.classList.toggle('sel', oi === val); }); }
    else if (q.kind === 'tf') { var bs = $('qbody').querySelectorAll('.tf-btn'); bs[0].classList.toggle('sel-t', val === true); bs[1].classList.toggle('sel-f', val === false); }
  }

  // raccoglie il valore corrente della domanda aperta nel modello
  function collectCurrent() {
    var q = QUESTIONS[i]; var a = ANSWERS[q.idx] || {};
    if (q.kind === 'open') {
      var ta = $('qopen'); if (ta && ta.value.trim()) { a.text = ta.value; delete a.skipped; ANSWERS[q.idx] = a; }
      else if (ta && a.text) { a.text = ta.value; ANSWERS[q.idx] = a; }
    }
  }

  function accumMs() {
    var q = QUESTIONS[i]; var a = ANSWERS[q.idx];
    if (!a) return;
    a.ms = (a.ms || 0) + Math.max(0, Date.now() - qStart);
    qStart = Date.now();
  }

  // salva su localStorage + POST (autosave, con retry leggero)
  function saveAnswer(idx) {
    var a = ANSWERS[idx]; if (!a) return;
    a.updatedAt = Date.now();
    saveLocal();
    var payload = { token: TOKEN, emojiKey: IDENT.emojiKey, num: IDENT.num, deviceId: deviceId, qIdx: idx, ms: a.ms || 0 };
    if (a.skipped) payload.skipped = true;
    else if (a.choice !== undefined) payload.choice = a.choice;
    else if (a.text !== undefined) payload.text = a.text;
    if (a.hintUsed) payload.hintUsed = true;   // Timeline (008): uso indizio
    setSync('wait');
    post('/api/answer', payload).then(function (r) {
      if (r.status === 200) {
        setSync('ok');
        if (r.body && r.body.verdetto) {
          VERDETTI[idx] = r.body.verdetto;
          if (QUESTIONS[i] && QUESTIONS[i].idx === idx) { mostraVerdetto(idx); bloccaDomanda(); }
        }
      }
      else if (r.status === 409 && r.body && r.body.error === 'closed') { setSync('ok'); showDone(true); }
      else if (r.status === 409 && r.body && r.body.error === 'already-graded') {
        /* già corretta: il server ha ragione e la POST non passerà mai. Si
           rimette a schermo il verdetto vero invece di ritentare a vuoto —
           `scheduleRetry` qui girava ogni 4s per sempre, col pallino in errore. */
        setSync('ok');
        if (r.body.verdetto) {
          VERDETTI[idx] = r.body.verdetto;
          if (QUESTIONS[i] && QUESTIONS[i].idx === idx) {
            var a2 = ANSWERS[idx] || {};
            if (r.body.verdetto.scelta !== undefined) a2.choice = r.body.verdetto.scelta;
            renderQuestion();
          }
        }
      }
      else { setSync('err'); scheduleRetry(idx); }
    }).catch(function () { setSync('err'); scheduleRetry(idx); });
  }
  var retryPend = {};
  function scheduleRetry(idx) {
    retryPend[idx] = true;
    setTimeout(function () { if (retryPend[idx]) { delete retryPend[idx]; saveAnswer(idx); } }, 4000);
  }
  function setSync(s) { var el = $('sync'); el.className = s; el.textContent = s === 'err' ? '⚠' : '●'; }

  // salva la domanda corrente prima di lasciarla
  function flushCurrent() {
    var q = QUESTIONS[i]; if (!q) return;
    collectCurrent(); accumMs();
    if (ANSWERS[q.idx]) saveAnswer(q.idx);
  }

  $('back').onclick = function () { if (i === 0) return; flushCurrent(); i--; renderQuestion(); };
  $('next').onclick = function () {
    flushCurrent();
    if (i < QUESTIONS.length - 1) { i++; renderQuestion(); }
    else showDone(false);
  };
  $('skip').onclick = function () {
    var q = QUESTIONS[i]; accumMs();
    var a = ANSWERS[q.idx] || {}; a.skipped = true; delete a.choice; delete a.text;
    ANSWERS[q.idx] = a; saveAnswer(q.idx);
    if (i < QUESTIONS.length - 1) { i++; renderQuestion(); } else showDone(false);
  };

  // ── Schermo intero (concentrazione) ──────────────────────────────────────
  // Fullscreen API dove supportata (Android/iPad/desktop). Su iPhone Safari NON
  // è supportata → suggerisce «Aggiungi a Home» (i meta apple-* aprono l'app
  // senza barre del browser). Interruttore nella barra del player.
  (function () {
    var btn = $('pfull'); if (!btn) return;
    var docEl = document.documentElement;
    var canFs = !!(docEl.requestFullscreen || docEl.webkitRequestFullscreen);
    function inFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    btn.onclick = function () {
      if (canFs) {
        try {
          if (!inFs()) { (docEl.requestFullscreen || docEl.webkitRequestFullscreen).call(docEl); }
          else { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
        } catch (e) {}
      } else {
        // iPhone: nessun fullscreen web → istruzione una-tantum
        alert('Per lo schermo intero: tocca Condividi ⬆︎ nel browser → «Aggiungi a Home», poi apri MappAI dall\'icona. Si aprirà senza le barre del browser.');
      }
    };
    document.addEventListener('fullscreenchange', function () { btn.textContent = inFs() ? '⛶' : '⛶'; });
  })();

  // ── Done ──
  function showDone(closed) {
    clearInterval(pollTimer); clearInterval(timerTimer);
    show('done');
    var answered = 0, skipped = 0;
    QUESTIONS.forEach(function (q) { var a = ANSWERS[q.idx]; if (a && a.skipped) skipped++; else if (a && (a.choice !== undefined || a.text)) answered++; });
    $('done-recap').innerHTML = 'Risposte: <b>' + answered + '</b> / ' + QUESTIONS.length + (skipped ? ' · saltate: ' + skipped : '');
    if (closed) {
      $('done-emoji').textContent = '🔒'; $('done-title').textContent = 'Sessione chiusa';
      $('done-msg').textContent = 'Grazie! L\'insegnante ha chiuso il quiz.';
      $('review').style.display = 'none'; $('submit').style.display = 'none';
      // Alla chiusura carica il risultato finale (con soluzioni se il docente le ha attivate)
      if (IDENT) {
        var idq = IDENT.nick ? ('&nick=' + encodeURIComponent(IDENT.nick))
          : ('&emojiKey=' + encodeURIComponent(IDENT.emojiKey || '') + '&num=' + encodeURIComponent(IDENT.num || ''));
        api('/api/my-result?s=' + encodeURIComponent(TOKEN) + idq + '&deviceId=' + encodeURIComponent(deviceId))
          .then(function (r) { if (r.status === 200 && r.body && r.body.result) renderResult(r.body); });
      }
    } else {
      $('done-emoji').textContent = '🎉'; $('done-title').textContent = 'Hai finito!';
      $('review').style.display = ''; $('submit').style.display = '';
    }
  }
  $('review').onclick = function () { i = 0; startPlayerResume(); };
  function startPlayerResume() { show('player'); renderQuestion(); if (!pollTimer) startPlayer(); }
  $('submit').onclick = function () {
    flushCurrent();
    post('/api/finish', { token: TOKEN, emojiKey: IDENT.emojiKey, num: IDENT.num, deviceId: deviceId }).then(function (r) {
      $('done-msg').textContent = 'Consegnato!';
      if (r && r.body && r.body.result) renderResult(r.body);
    });
  };
  $('result-save').onclick = function () { window.print(); };

  // Dashboard risultato: % + (se il docente ha attivato le soluzioni) dettaglio per domanda.
  function renderResult(data) {
    var res = (data && data.result) || {};
    $('review').style.display = 'none';
    $('submit').style.display = 'none';
    $('done-msg').textContent = data.revealAnswers
      ? 'Ecco com’è andata. Puoi salvare il tuo risultato.'
      : 'Consegnato! L’insegnante ha scelto di non mostrare le soluzioni.';
    var acc = res.accuracyPct || 0;
    var col = acc >= 70 ? '#16a34a' : acc >= 40 ? '#d97706' : '#dc2626';
    $('result-score').innerHTML =
      '<div class="pct" style="color:' + col + '">' + acc + '%</div>' +
      '<div class="sub">' + res.right + ' giuste su ' + res.attempted + ' date' +
      (res.halfCount ? ' · ' + res.halfCount + ' mezzo punto' : '') +
      (res.blank ? ' · ' + res.blank + ' in bianco' : '') +
      (res.manual ? ' · ' + res.manual + ' da correggere' : '') + '</div>';
    var list = '';
    var reveal = data.revealAnswers && Array.isArray(res.perQuestion) && res.perQuestion.length && res.perQuestion[0].text !== undefined;
    if (reveal) {
      res.perQuestion.forEach(function (q, n) {
        var half = (q.missing && q.missing.length);
        var ic = q.outcome === 'right' ? '✅' : half ? '½' : q.outcome === 'blank' ? '⬜️' : q.outcome === 'manual' ? '✍️' : '❌';
        var bodyHtml = (q.yourText ? '<div class="rq-a">La tua risposta: <b>' + esc(q.yourText) + '</b></div>'
                                   : '<div class="rq-a" style="color:#94a3b8">Nessuna risposta</div>') +
          (q.outcome !== 'right' && q.correctText ? '<div class="rq-c">Corretta: ' + esc(q.correctText) + '</div>' : '');
        list += '<div class="rq">' +
          '<div class="rq-q">' + ic + ' ' + esc(q.text || ('Domanda ' + (n + 1))) + '</div>' +
          bodyHtml +
          (q.explanation ? '<div class="rq-e">' + esc(q.explanation) + '</div>' : '') +
          '</div>';
      });
    }
    $('result-list').innerHTML = list;
    $('result-save').style.display = reveal ? '' : 'none';
    $('result-dash').style.display = '';
  }

  // salva quando l'app va in background (chiusura schermo, cambio tab)
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && IDENT && $('player').classList.contains('on')) flushCurrent(); });

  boot();
})();
</script>
</body>
</html>
