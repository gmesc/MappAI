<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MappAI Live — Materiali di studio</title>
<!-- SPACE MONO È LOCALE (15/9/2026), come in index.html dal 18/8: lo serve il
     server LAN da public/fonts/ (allowlist `/public/fonts/`). Prima arrivava da
     fonts.googleapis.com e in aula senza rete — o dietro il filtro della scuola —
     il telefono dell'allievo cadeva sul monospace di sistema senza dire niente.
     Noto Color Emoji RESTA dalla rete: il file è 25 MB, e senza rete il telefono
     ha comunque le sue emoji (stessa scelta di index.html, commentata lì). -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:'Space Mono'; font-style:normal; font-weight:400;
    src:url('../fonts/SpaceMono-Regular.ttf') format('truetype'); font-display:swap; }
  @font-face { font-family:'Space Mono'; font-style:normal; font-weight:700;
    src:url('../fonts/SpaceMono-Bold.ttf') format('truetype'); font-display:swap; }
  /* Le 27 emoji che NON sono decorazione — l'identità dell'allievo e i codici
     d'accesso dei gruppi — da un font locale di 254 KB ritagliato da Noto
     (tools/font/emoji-sottoinsieme.py). Sta PRIMA di Noto nello stack: quelle
     si vedono anche senza rete e uguali su ogni telefono; le altre ripiegano
     come prima. */
  @font-face { font-family:'MappAI Emoji'; font-style:normal; font-weight:400;
    src:url('../fonts/MappAIEmoji.ttf') format('truetype'); font-display:swap; }
</style>
<style>
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent;
      /* ⚠️ Queste due pagine dichiaravano il font emoji e non lo mettevano nello
         stack: le emoji dei titoli cadevano su quelle di sistema (il guasto tipico —
         un'emoji prende il glifo dal PRIMO font dello stack che ce l'ha). */
      font-family: 'Space Mono', 'MappAI Emoji', 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', ui-monospace, monospace; }
  html, body { min-height: 100%; }
  body { background: #fafbff; color: #0f172a; padding: 24px 18px;
         background-image: radial-gradient(#ddd6fe 1px, transparent 1px); background-size: 24px 24px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; text-align: center; }
  .name { color: #4f46e5; font-weight: 700; text-align: center; margin: 4px 0 20px; }
  a.card { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0f172a;
           background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 15px 16px;
           margin-bottom: 10px; }
  a.card:active { background: #f8fafc; }
  .ico { width: 40px; height: 40px; border-radius: 10px; background: #eef2ff; color: #4f46e5;
         display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .meta { flex: 1; min-width: 0; }
  .fn { font-weight: 700; font-size: 15px; word-break: break-word; }
  .sz { font-size: 12px; color: #94a3b8; }
  .dl { font-size: 22px; color: #4f46e5; }
  .empty { text-align: center; color: #94a3b8; padding: 40px 0; }
  .err { text-align: center; color: #dc2626; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 Materiali di studio</h1>
  <div class="name" id="name"></div>
  <div id="list"><div class="empty">Carico…</div></div>
</div>
<script>
(function () {
  'use strict';
  var TOKEN = new URLSearchParams(location.search).get('s') || '';
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function human(n) { if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(0) + ' KB'; return (n / 1048576).toFixed(1) + ' MB'; }
  function ext(f) { var m = f.split('.').pop().toLowerCase(); return ({ pdf: '📕', png: '🖼', jpg: '🖼', jpeg: '🖼', html: '🌐', txt: '📄', docx: '📘', md: '📝' })[m] || '📎'; }

  if (!TOKEN) { document.getElementById('list').innerHTML = '<div class="err">Link non valido. Riscansiona il QR.</div>'; return; }
  fetch('/api/materials?s=' + encodeURIComponent(TOKEN)).then(function (r) { return r.json(); }).then(function (d) {
    document.getElementById('name').textContent = d.name || '';
    var list = document.getElementById('list');
    if (!d.files || !d.files.length) { list.innerHTML = '<div class="empty">Nessun materiale ancora pubblicato.</div>'; return; }
    list.innerHTML = d.files.map(function (f) {
      return '<a class="card" href="/files/' + encodeURIComponent(f.file) + '?s=' + encodeURIComponent(TOKEN) + '">' +
        '<div class="ico">' + ext(f.file) + '</div>' +
        '<div class="meta"><div class="fn">' + esc(f.file) + '</div><div class="sz">' + human(f.size) + '</div></div>' +
        '<div class="dl">↓</div></a>';
    }).join('');
  }).catch(function () { document.getElementById('list').innerHTML = '<div class="err">Materiali non raggiungibili. Sei sulla rete della classe?</div>'; });
})();
</script>
</body>
</html>
