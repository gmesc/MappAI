<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MappAI — Lavagna collaborativa</title>
<!-- Stesso font della viewport mappa dell'app + emoji Android (Noto) come le altre pagine LAN
     (fallback monospace / emoji di sistema se la LAN è offline) -->
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
  /* emoji Android (Noto) prima del fallback di sistema — regola globale MappAI */
  :root { --emoji: 'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent;
      font-family: 'Space Mono', var(--emoji), ui-monospace, monospace; }
  html, body { height: 100%; }
  body { background: #fafbff; color: #0f172a; display: flex; flex-direction: column; overflow: hidden; }
  button { cursor: pointer; border: 0; }

  /* ── Join ── */
  #join { flex: 1; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 14px; padding: 24px; text-align: center;
          background-image: radial-gradient(#ddd6fe 1px, transparent 1px); background-size: 24px 24px; }
  #join h1 { font-size: 22px; font-weight: 700; }
  #join .map-name { color: #4f46e5; font-weight: 700; font-size: 15px; }
  #join input { width: min(320px, 84vw); padding: 13px 16px; border-radius: 12px;
                border: 2px solid #e2e8f0; background: #fff; color: #0f172a;
                font-size: 16px; text-align: center; outline: none; }
  #join input:focus { border-color: #6366f1; }
  #join button { width: min(320px, 84vw); padding: 13px; border-radius: 12px;
                 background: #4f46e5; color: #fff; font-size: 16px; font-weight: 700; }
  #join .err { color: #dc2626; font-size: 13px; min-height: 18px; }
  /* Login individuale: griglia emoji compatta, chip quadrati touch-friendly (≥44px).
     Prefisso #join per battere la specificità di `#join button` (stile del bottone Entra). */
  #emoji-grid { display: grid; grid-template-columns: repeat(4, 60px); gap: 10px;
                justify-content: center; width: min(320px, 84vw); margin: 0 auto 10px; }
  #join .emoji-btn { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;
               padding: 0; font-size: 30px; line-height: 1; border: 2px solid #e2e8f0;
               border-radius: 14px; background: #fff; color: #0f172a; font-family: var(--emoji); }
  #join .emoji-btn.sel { border-color: #4f46e5; background: #eef2ff; }

  /* ── Editor ── */
  #editor { flex: 1; display: none; flex-direction: column; min-height: 0; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
           background: #fff; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
  header .title { font-weight: 700; font-size: 13px; color: #334155; flex: 1;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nick-badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: #fff; }
  #sync { font-size: 11px; color: #64748b; }
  #sync.ok::before { content: '● '; color: #16a34a; }
  #sync.wait::before { content: '● '; color: #d97706; }
  #sync.err::before { content: '● '; color: #dc2626; }
  #done-btn { background: #16a34a; color: #fff; border-radius: 8px; padding: 5px 12px;
              font-size: 11px; font-weight: 700; }
  #done-btn.is-done { background: #dcfce7; color: #166534; cursor: default; }
  #board-toggle { background: #f1f5f9; color: #94a3b8; border-radius: 8px;
                  padding: 5px 10px; font-size: 11px; font-weight: 700; }
  #board-toggle.ready { background: #e2e8f0; color: #334155; }
  #board-toggle.on { background: #4f46e5; color: #fff; }

  /* Canvas = viewport mappa dell'app: stesso sfondo a puntini */
  #canvas-wrap { flex: 1; min-height: 0; position: relative;
                 background-color: #fafbff;
                 background-image: radial-gradient(#ddd6fe 1px, transparent 1px);
                 background-size: 24px 24px; }
  svg { width: 100%; height: 100%; display: block; touch-action: none; }

  /* Root = nodo L0 dell'app: cerchio scuro, label centrata con alone bianco */
  .root-circle { fill: #0f172a; stroke: #0f172a; stroke-width: 2; }
  /* Label = .node-text dell'app: bold, alone bianco (paint-order stroke) */
  .map-label { pointer-events: none; text-anchor: middle; font-weight: 700;
               fill: #0f172a; stroke: #ffffff; stroke-width: 2.6px;
               stroke-linejoin: round; paint-order: stroke fill; }
  .snode rect { stroke-width: 2.5; cursor: grab; }
  .snode.ghost { opacity: .55; pointer-events: none; }
  .snode.sel rect { stroke-dasharray: 6 3; }
  .snode.linkfrom rect { stroke: #4f46e5; stroke-width: 4; }
  .slink { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
  .slink-label { text-anchor: middle; font-size: 11px; font-weight: 700;
                 fill: #64748b; stroke: #ffffff; stroke-width: 2.4px;
                 stroke-linejoin: round; paint-order: stroke fill; cursor: pointer; }
  #mode-hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
               background: #4f46e5; color: #fff; font-size: 12px; font-weight: 700;
               padding: 6px 14px; border-radius: 999px; display: none; white-space: nowrap; }

  /* ── Toolbar ── */
  #toolbar { background: #fff; border-top: 1px solid #e2e8f0; padding: 10px 12px;
             display: flex; flex-direction: column; gap: 8px; }
  #toolbar .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #node-text { flex: 1; min-width: 140px; padding: 10px 12px; border-radius: 10px;
               border: 2px solid #e2e8f0; background: #fff; color: #0f172a;
               font-size: 15px; outline: none; }
  #node-text:focus { border-color: #6366f1; }
  .chip { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; }
  .chip.sel { border-color: #0f172a; transform: scale(1.15); }
  .size-btn { background: #f1f5f9; color: #334155; border-radius: 8px; padding: 6px 10px;
              font-size: 12px; font-weight: 800; }
  .size-btn.sel { background: #6366f1; color: #fff; }
  #add-btn { background: #16a34a; color: #fff; border-radius: 10px; padding: 10px 18px;
             font-weight: 800; font-size: 14px; }
  #link-btn { background: #f1f5f9; color: #334155; border-radius: 10px; padding: 10px 14px;
              font-weight: 700; font-size: 13px; }
  #link-btn.on { background: #4f46e5; color: #fff; }
  #del-btn { background: #fee2e2; color: #b91c1c; border-radius: 10px; padding: 10px 14px;
             font-weight: 700; font-size: 13px; display: none; }
  #hint { font-size: 10.5px; color: #94a3b8; }

  /* ── Dialog keyword collegamento ── */
  #dlg { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none;
         align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  #dlg .box { background: #fff; border-radius: 14px; padding: 18px; width: min(360px, 90vw);
              display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  #dlg .box b { font-size: 13px; }
  #dlg input { padding: 10px 12px; border-radius: 10px; border: 2px solid #e2e8f0;
               font-size: 15px; outline: none; }
  #dlg input:focus { border-color: #6366f1; }
  #dlg .btns { display: flex; gap: 8px; justify-content: flex-end; }
  #dlg .btns button { border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 13px; }
  #dlg-ok { background: #4f46e5; color: #fff; }
  #dlg-cancel { background: #f1f5f9; color: #334155; }
  #dlg-del { background: #fee2e2; color: #b91c1c; margin-right: auto; display: none; }
  #center-btn { position: absolute; top: 10px; right: 10px; z-index: 5;
                background: rgba(255,255,255,.95); border: 1px solid #e2e8f0; border-radius: 999px;
                padding: 7px 12px; font-size: 12px; font-weight: 700; color: #334155; cursor: pointer;
                box-shadow: 0 4px 12px rgba(0,0,0,.12); display: flex; align-items: center; gap: 5px; }
  #center-btn:active { background: #eef2ff; }
</style>
</head>
<body>

<div id="join">
  <h1>Lavagna collaborativa</h1>
  <div class="map-name" id="join-map"></div>
  <input id="nick" maxlength="24" placeholder="Nome del gruppo (es. I Leoni)" autocomplete="off">
  <div id="join-individual" style="display:none">
    <div id="emoji-grid"></div>
    <input id="in-num" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="Il tuo numero (es. 07)" autocomplete="off">
  </div>
  <button id="join-btn">Entra</button>
  <div class="err" id="join-err"></div>
</div>

<div id="editor">
  <header>
    <span class="title" id="hd-title"></span>
    <span class="nick-badge" id="hd-nick"></span>
    <span id="sync" class="ok">salvato</span>
    <button id="done-btn" type="button">Fatto ✓</button>
    <button id="board-toggle" type="button" title="Prima premi Fatto">Mostra classe</button>
  </header>
  <div id="canvas-wrap">
    <svg id="cv">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"></path>
        </marker>
      </defs>
    </svg>
    <div id="mode-hint"></div>
    <button id="center-btn" type="button" title="Centra la mappa">⤢ Centra</button>
  </div>
  <div id="toolbar">
    <div class="row">
      <input id="node-text" maxlength="80" placeholder="Testo del nodo…" autocomplete="off">
      <button id="add-btn" type="button">Aggiungi</button>
      <button id="link-btn" type="button">⇢ Collega</button>
      <button id="del-btn" type="button">Elimina</button>
    </div>
    <div class="row">
      <span id="chips"></span>
      <span>
        <button class="size-btn" data-size="s" type="button">S</button>
        <button class="size-btn" data-size="m" type="button">M</button>
        <button class="size-btn sel" data-size="l" type="button">L</button>
      </span>
      <span id="hint">Tocca per modificare · trascina per spostare · tieni premuto per il menu · pizzica per zoom, trascina lo sfondo per spostarti (doppio tap = reset)</span>
    </div>
  </div>
</div>

<div id="dlg">
  <div class="box">
    <b id="dlg-title">Parola di collegamento</b>
    <input id="dlg-input" maxlength="30" placeholder="es. causa, produce, richiede…" autocomplete="off">
    <div class="btns">
      <button id="dlg-del" type="button">Elimina</button>
      <button id="dlg-cancel" type="button">Annulla</button>
      <button id="dlg-ok" type="button">OK</button>
    </div>
  </div>
</div>

<script src="/public/js/mappai-collab-core.js"></script>
<script>
(function () {
  'use strict';
  var C = window.MappAICollabCore;
  var ROOT_ID = C.ROOT_ID || '__root__';
  var qs = new URLSearchParams(location.search);
  var TOKEN = qs.get('s') || '';
  var deviceId = localStorage.getItem('collab_device') ||
    (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
  localStorage.setItem('collab_device', deviceId);

  var S = {
    nick: localStorage.getItem('collab_nick_' + TOKEN) || '',
    color: C.PALETTE[0],
    rootLabel: '', mapName: '',
    myNodes: [], myLinks: [],
    others: [],                 // gruppi altrui (board, sola lettura)
    selId: null,                // nodo selezionato per edit
    linkFrom: null,             // primo capo in modalità collega
    linkMode: false,
    done: false,
    curColor: C.PALETTE[5], curSize: 'l',
    showBoard: false, dirty: false,
    view: { k: 1, tx: 0, ty: 0 }   // zoom/pan della mappa (pizzica + trascina sfondo)
  };

  function $(id) { return document.getElementById(id); }
  function api(p, opts) {
    return fetch(p, opts).then(function (r) {
      return r.json().then(function (b) { return { status: r.status, body: b }; });
    });
  }

  // ── Boot ────────────────────────────────────────────────────────────────
  api('/api/session?s=' + encodeURIComponent(TOKEN)).then(function (r) {
    if (r.status !== 200) { $('join-err').textContent = 'Sessione non valida — richiedi un nuovo QR.'; return; }
    S.mapName = r.body.session.name;
    S.rootLabel = r.body.session.rootLabel;
    S.loginMode = r.body.loginMode || 'group';
    $('join-map').textContent = S.mapName;
    $('hd-title').textContent = S.mapName;
    // US5: login individuale → emoji + numero dal roster
    if (S.loginMode === 'individual') {
      $('nick').style.display = 'none';
      $('join-individual').style.display = 'block';
      var g = $('emoji-grid'); g.innerHTML = '';
      (r.body.emojiSet || []).forEach(function (e) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'emoji-btn';
        b.textContent = e.emoji; b.setAttribute('data-key', e.key);
        b.onclick = function () {
          S.chosenEmoji = e.key;
          g.querySelectorAll('.emoji-btn').forEach(function (x) { x.classList.toggle('sel', x === b); });
        };
        g.appendChild(b);
      });
    } else if (S.nick) { $('nick').value = S.nick; }
  }).catch(function () { $('join-err').textContent = 'Server non raggiungibile.'; });

  $('join-btn').onclick = function () {
    var payload = { token: TOKEN, deviceId: deviceId };
    if (S.loginMode === 'individual') {
      var num = ($('in-num').value || '').trim().padStart(2, '0');
      if (!S.chosenEmoji || !num) { $('join-err').textContent = 'Scegli emoji e numero.'; return; }
      payload.emojiKey = S.chosenEmoji; payload.num = num;
    } else {
      var nick = C.sanitizeNick($('nick').value);
      if (!nick) { $('join-err').textContent = 'Nome gruppo: da 2 a 24 caratteri.'; return; }
      payload.nick = nick;
    }
    api('/api/join', { method: 'POST', body: JSON.stringify(payload) })
      .then(function (r) {
        if (r.status === 409) { $('join-err').textContent = 'Nome già in uso da un altro gruppo — scegline un altro.'; return; }
        if (r.status !== 200) { $('join-err').textContent = 'Errore di accesso (' + r.status + ').'; return; }
        S.nick = r.body.nick; S.color = r.body.color;
        S.myNodes = r.body.nodes || [];
        localStorage.setItem('collab_nick_' + TOKEN, S.nick);
        $('join').style.display = 'none';
        $('editor').style.display = 'flex';
        var b = $('hd-nick'); b.textContent = S.nick; b.style.background = S.color;
        S.curColor = S.color;
        buildChips();
        // ripresa: recupera link e stato "fatto" dal board
        api('/api/board?s=' + encodeURIComponent(TOKEN)).then(function (br) {
          if (br.status === 200) {
            var mine = (br.body.groups || []).find(function (g) { return g.nick === S.nick; });
            if (mine) { S.myLinks = mine.links || []; if (mine.done) setDone(true, false); }
          }
          render();
        }).catch(function () { render(); });
      })
      .catch(function () { $('join-err').textContent = 'Server non raggiungibile.'; });
  };

  // ── Toolbar ─────────────────────────────────────────────────────────────
  function buildChips() {
    var el = $('chips'); el.innerHTML = '';
    C.PALETTE.forEach(function (col) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip' + (col === S.curColor ? ' sel' : '');
      b.style.background = col;
      b.onclick = function () {
        S.curColor = col;
        el.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('sel'); });
        b.classList.add('sel');
        if (S.selId) { withSel(function (n) { n.color = col; n.updatedAt = Date.now(); }); }
      };
      el.appendChild(b);
    });
  }
  document.querySelectorAll('.size-btn').forEach(function (b) {
    b.onclick = function () {
      S.curSize = b.getAttribute('data-size');
      document.querySelectorAll('.size-btn').forEach(function (x) { x.classList.remove('sel'); });
      b.classList.add('sel');
      if (S.selId) { withSel(function (n) { n.size = S.curSize; n.updatedAt = Date.now(); }); }
    };
  });

  function withSel(fn) {
    var n = S.myNodes.find(function (x) { return x.id === S.selId; });
    if (n) { fn(n); markDirty(); render(); }
  }

  $('add-btn').onclick = function () {
    var text = C.sanitizeText($('node-text').value);
    if (!text) return;
    if (S.selId) {
      withSel(function (n) { n.text = text; n.updatedAt = Date.now(); });
      select(null);
      $('node-text').value = '';
      return;
    }
    if (S.myNodes.length >= C.LIMITS.nodesPerGroup) return;
    var angle = Math.random() * Math.PI * 2;
    S.myNodes.push({
      id: 'n' + Date.now().toString(36) + Math.floor(Math.random() * 1000),
      text: text, color: S.curColor, size: S.curSize,
      x: Math.cos(angle) * 0.7, y: Math.sin(angle) * 0.7,
      updatedAt: Date.now()
    });
    $('node-text').value = '';
    markDirty(); render();
  };

  $('del-btn').onclick = function () {
    if (!S.selId) return;
    S.myNodes = S.myNodes.filter(function (n) { return n.id !== S.selId; });
    // i link appesi al nodo eliminato muoiono con lui
    S.myLinks = S.myLinks.filter(function (l) { return l.source !== S.selId && l.target !== S.selId; });
    select(null); markDirty(); render();
  };

  function select(id) {
    S.selId = id;
    var n = id && S.myNodes.find(function (x) { return x.id === id; });
    $('del-btn').style.display = n ? 'inline-block' : 'none';
    $('add-btn').textContent = n ? 'Salva' : 'Aggiungi';
    if (n) { $('node-text').value = n.text; }
    render();
  }

  // ── Modalità Collega (tap A → tap B → keyword) ──────────────────────────
  $('link-btn').onclick = function () { setLinkMode(!S.linkMode); };
  function setLinkMode(on) {
    S.linkMode = on;
    S.linkFrom = null;
    select(null);
    $('link-btn').classList.toggle('on', on);
    var h = $('mode-hint');
    if (on) { h.textContent = 'Tocca il PRIMO nodo (o il centro) da collegare'; h.style.display = 'block'; }
    else h.style.display = 'none';
    render();
  }
  function linkTap(nodeId) {
    if (!S.linkFrom) {
      S.linkFrom = nodeId;
      $('mode-hint').textContent = 'Ora tocca il SECONDO nodo';
      render();
      return;
    }
    if (S.linkFrom === nodeId) { S.linkFrom = null; render(); return; }
    var from = S.linkFrom;
    openLinkDialog(null, function (rel) {
      S.myLinks.push({
        id: 'l' + Date.now().toString(36) + Math.floor(Math.random() * 1000),
        source: from, target: nodeId, rel: rel, updatedAt: Date.now()
      });
      markDirty(); setLinkMode(false);
    });
  }

  // Dialog keyword: crea (link=null) o modifica/elimina (link esistente)
  function openLinkDialog(link, onOk) {
    var dlg = $('dlg'), inp = $('dlg-input'), del = $('dlg-del');
    inp.value = link ? (link.rel === 'collega' ? '' : link.rel) : '';
    del.style.display = link ? 'inline-block' : 'none';
    dlg.style.display = 'flex';
    setTimeout(function () { inp.focus(); }, 50);
    function close() { dlg.style.display = 'none'; $('dlg-ok').onclick = $('dlg-cancel').onclick = del.onclick = inp.onkeydown = null; }
    $('dlg-ok').onclick = function () {
      var rel = C.sanitizeText(inp.value).slice(0, C.LIMITS.relMax);
      close();
      if (link) { link.rel = rel || 'collega'; link.updatedAt = Date.now(); markDirty(); render(); }
      else if (onOk) onOk(rel);
    };
    $('dlg-cancel').onclick = function () { close(); if (!link) setLinkMode(false); };
    del.onclick = function () {
      close();
      S.myLinks = S.myLinks.filter(function (l) { return l.id !== link.id; });
      markDirty(); render();
    };
    inp.onkeydown = function (e) { if (e.key === 'Enter') $('dlg-ok').click(); };
  }

  // ── Fatto ✓ → sblocca "Mostra classe" ───────────────────────────────────
  $('done-btn').onclick = function () {
    if (S.done) return;
    setDone(true, true);
  };
  function setDone(val, push) {
    S.done = val;
    var d = $('done-btn'), bt = $('board-toggle');
    if (val) {
      d.textContent = '✓ Consegnato';
      d.classList.add('is-done');
      bt.classList.add('ready');
      bt.title = '';
    }
    if (push) { markDirty(); }
  }

  var boardTimer = null;
  $('board-toggle').onclick = function () {
    if (!S.done) {
      var h = $('mode-hint');
      h.textContent = 'Prima premi "Fatto ✓" per consegnare';
      h.style.display = 'block';
      setTimeout(function () { if (!S.linkMode) h.style.display = 'none'; }, 1800);
      return;
    }
    S.showBoard = !S.showBoard;
    this.classList.toggle('on', S.showBoard);
    if (S.showBoard) { pollBoard(); }
    else { clearTimeout(boardTimer); S.others = []; render(); }
  };
  function pollBoard() {
    api('/api/board?s=' + encodeURIComponent(TOKEN)).then(function (r) {
      if (r.status === 200) {
        S.others = (r.body.groups || []).filter(function (g) { return g.nick !== S.nick; });
        render();
      }
    }).catch(function () {});
    boardTimer = setTimeout(pollBoard, 5000);
  }

  // ── Sync automatico ─────────────────────────────────────────────────────
  var syncTimer = null;
  function markDirty() {
    S.dirty = true;
    setSync('wait', 'in attesa…');
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushNodes, 800);
  }
  function setSync(cls, txt) { var s = $('sync'); s.className = cls; s.textContent = txt; }
  function pushNodes() {
    api('/api/nodes', {
      method: 'POST',
      body: JSON.stringify({
        token: TOKEN, nick: S.nick, deviceId: deviceId,
        nodes: S.myNodes, links: S.myLinks, done: S.done || undefined
      })
    }).then(function (r) {
      if (r.status === 200) { S.dirty = false; setSync('ok', 'salvato'); }
      else setSync('err', 'errore ' + r.status);
    }).catch(function () {
      setSync('err', 'offline — riprovo');
      clearTimeout(syncTimer); syncTimer = setTimeout(pushNodes, 3000);
    });
  }

  // ── Render SVG ──────────────────────────────────────────────────────────
  var svg = $('cv');
  var NS = 'http://www.w3.org/2000/svg';
  function geo() {
    var r = svg.getBoundingClientRect();
    return { cx: r.width / 2, cy: r.height / 2, R: Math.min(r.width, r.height) / 2 * 0.82, w: r.width, h: r.height };
  }
  function px(n, g) { return { x: g.cx + n.x * g.R, y: g.cy + n.y * g.R }; }

  // Font per taglia — scalati sul nuovo ladder (L = vecchia S)
  var FONT = { s: 11, m: 13, l: 15 };
  var WRAP = { s: 9, m: 11, l: 13 };

  function wrapText(textEl, str, maxChars, x) {
    var words = String(str).split(' ');
    var lines = [''];
    words.forEach(function (w) {
      var cur = lines[lines.length - 1];
      if ((cur + ' ' + w).trim().length > maxChars && cur) lines.push(w);
      else lines[lines.length - 1] = (cur + ' ' + w).trim();
    });
    lines = lines.slice(0, 3);
    lines.forEach(function (ln, i) {
      var ts = document.createElementNS(NS, 'tspan');
      ts.setAttribute('x', x || 0);
      ts.setAttribute('dy', i === 0 ? (-(lines.length - 1) * 0.55) + 'em' : '1.1em');
      ts.textContent = ln;
      textEl.appendChild(ts);
    });
  }

  // il root (centro mappa) è un'estremità valida ma non è nei nodi del gruppo:
  // lo risolvo a coordinate 0,0 (= centro) con un raggio equivalente al cerchio r45
  function endpoint(id, nodes) {
    if (id === ROOT_ID) return { id: ROOT_ID, x: 0, y: 0, size: 'm', __root: true };
    return nodes.find(function (n) { return n.id === id; });
  }
  function drawLink(l, nodes, mine, g) {
    var a = endpoint(l.source, nodes);
    var b = endpoint(l.target, nodes);
    if (!a || !b) return;
    var pa = px(a, g), pb = px(b, g);
    // accorcia sul bordo del rect di destinazione (freccia visibile)
    var sz = b.__root ? { w: 90, h: 90 } : (C.SIZES[b.size] || C.SIZES.m);
    var dx = pb.x - pa.x, dy = pb.y - pa.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var cut = Math.min(sz.w, sz.h) / 2 + 6;
    var ex = pb.x - dx / len * cut, ey = pb.y - dy / len * cut;
    var line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', pa.x); line.setAttribute('y1', pa.y);
    line.setAttribute('x2', ex); line.setAttribute('y2', ey);
    line.setAttribute('class', 'slink');
    if (!mine) line.setAttribute('opacity', '.5');
    line.setAttribute('marker-end', 'url(#arrow)');
    layer.appendChild(line);
    var lbl = document.createElementNS(NS, 'text');
    lbl.setAttribute('class', 'slink-label');
    lbl.setAttribute('x', (pa.x + pb.x) / 2);
    lbl.setAttribute('y', (pa.y + pb.y) / 2 - 5);
    if (!mine) { lbl.setAttribute('opacity', '.5'); lbl.style.pointerEvents = 'none'; }
    lbl.textContent = l.rel;
    if (mine) lbl.addEventListener('pointerup', function (e) { e.stopPropagation(); openLinkDialog(l); });
    layer.appendChild(lbl);
  }

  function drawNode(n, mine, borderColor, g) {
    var sz = C.SIZES[n.size] || C.SIZES.m;
    var p = px(n, g);
    var grp = document.createElementNS(NS, 'g');
    grp.setAttribute('class', 'snode' + (mine ? ' mine' : ' ghost') +
      (S.selId === n.id ? ' sel' : '') + (S.linkFrom === n.id ? ' linkfrom' : ''));
    grp.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')');
    var rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', -sz.w / 2); rect.setAttribute('y', -sz.h / 2);
    rect.setAttribute('width', sz.w); rect.setAttribute('height', sz.h);
    rect.setAttribute('rx', 10);
    rect.setAttribute('fill', n.color);
    rect.setAttribute('stroke', borderColor);
    grp.appendChild(rect);
    var txt = document.createElementNS(NS, 'text');
    txt.setAttribute('class', 'map-label');
    txt.setAttribute('font-size', FONT[n.size] || FONT.m);
    wrapText(txt, n.text, WRAP[n.size] || WRAP.m);
    grp.appendChild(txt);
    if (mine) attachDrag(grp, n, g);
    layer.appendChild(grp);
  }

  var layer = null;   // viewport <g>: contiene TUTTO il disegno, riceve zoom/pan
  function applyView() {
    if (layer) layer.setAttribute('transform',
      'translate(' + S.view.tx + ',' + S.view.ty + ') scale(' + S.view.k + ')');
  }

  // "Centra": inquadra root + tutti i miei nodi (zoom-out per farli entrare;
  // mai zoom-in oltre 1×). Recupera i nodi finiti fuori vista dopo pan/zoom.
  function fitView() {
    var g = geo();
    var minX = g.cx - 45, maxX = g.cx + 45, minY = g.cy - 45, maxY = g.cy + 45; // root
    S.myNodes.forEach(function (n) {
      var sz = C.SIZES[n.size] || C.SIZES.m, p = px(n, g);
      minX = Math.min(minX, p.x - sz.w / 2); maxX = Math.max(maxX, p.x + sz.w / 2);
      minY = Math.min(minY, p.y - sz.h / 2); maxY = Math.max(maxY, p.y + sz.h / 2);
    });
    var pad = 40, bw = Math.max(1, maxX - minX), bh = Math.max(1, maxY - minY);
    var k = Math.max(0.3, Math.min(1, Math.min((g.w - 2 * pad) / bw, (g.h - 2 * pad) / bh)));
    S.view.k = k;
    S.view.tx = g.w / 2 - k * (minX + maxX) / 2;
    S.view.ty = g.h / 2 - k * (minY + maxY) / 2;
    applyView();
  }
  function render() {
    var g = geo();
    // pulisci tutto tranne <defs> (marker freccia)
    Array.prototype.slice.call(svg.childNodes).forEach(function (ch) {
      if (ch.nodeName !== 'defs') svg.removeChild(ch);
    });
    layer = document.createElementNS(NS, 'g');
    layer.setAttribute('id', 'cv-viewport');
    svg.appendChild(layer);
    applyView();
    // gruppi altrui sotto (ghost): prima i loro link, poi i loro nodi
    S.others.forEach(function (grp) {
      (grp.links || []).forEach(function (l) { drawLink(l, grp.nodes || [], false, g); });
    });
    S.others.forEach(function (grp) {
      (grp.nodes || []).forEach(function (n) { drawNode(n, false, grp.color, g); });
    });
    // i miei link sotto i miei nodi
    S.myLinks.forEach(function (l) { drawLink(l, S.myNodes, true, g); });
    // root = nodo L0 dell'app (cerchio r=45 scuro, label centrata con alone)
    var root = document.createElementNS(NS, 'g');
    root.setAttribute('class', 'sroot');
    root.setAttribute('transform', 'translate(' + g.cx + ',' + g.cy + ')');
    var rc = document.createElementNS(NS, 'circle');
    rc.setAttribute('class', 'root-circle');
    rc.setAttribute('r', 45);
    // in modalità collega il root è un'estremità tappabile (evidenziato se è il 1° capo)
    if (S.linkMode) {
      root.style.cursor = 'pointer';
      if (S.linkFrom === ROOT_ID) { rc.setAttribute('stroke', '#4f46e5'); rc.setAttribute('stroke-width', 5); }
    }
    root.appendChild(rc);
    var rl = document.createElementNS(NS, 'text');
    rl.setAttribute('class', 'map-label');
    rl.setAttribute('font-size', 14);
    rl.style.pointerEvents = 'none';
    wrapText(rl, S.rootLabel, 12);
    root.appendChild(rl);
    if (S.linkMode) root.addEventListener('pointerup', function (e) { e.stopPropagation(); linkTap(ROOT_ID); });
    layer.appendChild(root);
    // i miei nodi sopra
    S.myNodes.forEach(function (n) { drawNode(n, true, S.color, g); });
  }

  function clampCoord(v) { return Math.max(-C.LIMITS.coordMax, Math.min(C.LIMITS.coordMax, v)); }

  // ── Drag / tap / long-press (pointer events) ────────────────────────────
  // Delta-based e zoom-aware: lo spostamento tiene conto di S.view.k.
  // Tieni premuto 500ms senza muovere → menu contestuale del nodo.
  function attachDrag(grp, n, g) {
    var drag = null, lpTimer = null, lpFired = false;
    function clearLP() { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } }
    grp.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      grp.setPointerCapture(e.pointerId);
      lpFired = false;
      drag = { sx: e.clientX, sy: e.clientY, nx0: n.x, ny0: n.y, moved: false };
      if (!S.linkMode) {
        var cx0 = e.clientX, cy0 = e.clientY, pid = e.pointerId;
        lpTimer = setTimeout(function () {
          lpFired = true; drag = null;
          try { grp.releasePointerCapture(pid); } catch (_) {}
          openNodeMenu(n, cx0, cy0);
        }, 500);
      }
    });
    grp.addEventListener('pointermove', function (e) {
      if (!drag || S.linkMode) return;
      // soglia anti-jitter: un tap su touchscreen (Android) emette micro-pointermove →
      // sotto 6px è un tap (→ select), non un trascinamento
      if (!drag.moved) {
        if (Math.abs(e.clientX - drag.sx) < 6 && Math.abs(e.clientY - drag.sy) < 6) return;
        drag.moved = true; clearLP();
      }
      var k = (S.view && S.view.k) || 1;
      n.x = clampCoord(drag.nx0 + (e.clientX - drag.sx) / (k * g.R));
      n.y = clampCoord(drag.ny0 + (e.clientY - drag.sy) / (k * g.R));
      grp.setAttribute('transform', 'translate(' + px(n, g).x + ',' + px(n, g).y + ')');
    });
    grp.addEventListener('pointerup', function () {
      clearLP();
      if (lpFired) { lpFired = false; drag = null; return; }
      if (drag && drag.moved) { n.updatedAt = Date.now(); markDirty(); render(); }
      else if (S.linkMode) linkTap(n.id);
      else select(S.selId === n.id ? null : n.id);
      drag = null;
    });
    grp.addEventListener('pointercancel', function () { clearLP(); drag = null; });
  }

  // ── Menu contestuale del nodo (long-press): figlio / link / modifica ────
  function closeNodeMenu() {
    var m = document.getElementById('node-menu');
    if (m) m.remove();
    document.removeEventListener('pointerdown', onDocDownMenu, true);
  }
  function onDocDownMenu(e) { if (!e.target.closest('#node-menu')) closeNodeMenu(); }
  function openNodeMenu(n, x, y) {
    closeNodeMenu();
    var m = document.createElement('div');
    m.id = 'node-menu';
    m.style.cssText = 'position:fixed;z-index:60;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:6px;display:flex;flex-direction:column;min-width:170px';
    [['child', '＋ Crea figlio'], ['link', '⇢ Crea link'], ['edit', '✎ Modifica']].forEach(function (it) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = it[1];
      b.style.cssText = 'background:none;border:0;text-align:left;padding:11px 12px;font-size:14px;font-weight:700;color:#0f172a;border-radius:8px;cursor:pointer';
      b.onpointerdown = function (ev) { ev.stopPropagation(); };
      b.onclick = function () { nodeMenuAction(it[0], n); closeNodeMenu(); };
      m.appendChild(b);
    });
    document.body.appendChild(m);
    var mw = m.offsetWidth, mh = m.offsetHeight;
    m.style.left = Math.max(8, Math.min(x, window.innerWidth - mw - 8)) + 'px';
    m.style.top = Math.max(8, Math.min(y, window.innerHeight - mh - 8)) + 'px';
    setTimeout(function () { document.addEventListener('pointerdown', onDocDownMenu, true); }, 0);
  }
  function nodeMenuAction(action, n) {
    if (action === 'edit') {
      select(n.id);
      var inp = $('node-text'); inp.focus(); inp.select();
    } else if (action === 'link') {
      setLinkMode(true);
      S.linkFrom = n.id;
      $('mode-hint').textContent = 'Ora tocca il SECONDO nodo (o il centro)';
      render();
    } else if (action === 'child') {
      createChild(n);
    }
  }
  function createChild(parent) {
    if (S.myNodes.length >= C.LIMITS.nodesPerGroup) {
      var h = $('mode-hint'); h.textContent = 'Hai raggiunto il numero massimo di nodi'; h.style.display = 'block';
      setTimeout(function () { if (!S.linkMode) h.style.display = 'none'; }, 1800);
      return;
    }
    // spingi il figlio verso l'esterno rispetto al centro; se il padre è al centro, a destra
    var ang = (parent.x || parent.y) ? Math.atan2(parent.y, parent.x) : 0;
    var off = 0.55;
    var child = {
      id: 'n' + Date.now().toString(36) + Math.floor(Math.random() * 1000),
      text: 'Concetto', color: S.curColor, size: S.curSize,
      x: clampCoord(parent.x + Math.cos(ang) * off), y: clampCoord(parent.y + Math.sin(ang) * off),
      updatedAt: Date.now()
    };
    S.myNodes.push(child);
    S.myLinks.push({
      id: 'l' + Date.now().toString(36) + Math.floor(Math.random() * 1000),
      source: parent.id, target: child.id, rel: 'collega', updatedAt: Date.now()
    });
    markDirty(); select(child.id); render();
    var inp = $('node-text'); inp.focus(); inp.select();
  }

  // ── Zoom (pinch) + pan (trascina sfondo) su tutto il canvas ─────────────
  var pointers = new Map();
  var gesture = null;
  var lastBgTap = 0;
  function distp(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function svgPt(cx, cy) { var r = svg.getBoundingClientRect(); return { x: cx - r.left, y: cy - r.top }; }
  function startPinch() {
    var pts = Array.from(pointers.values());
    var mid = svgPt((pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2);
    gesture = {
      mode: 'pinch', d0: distp(pts[0], pts[1]) || 1, k0: S.view.k,
      wx: (mid.x - S.view.tx) / S.view.k, wy: (mid.y - S.view.ty) / S.view.k
    };
  }
  svg.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.snode') || e.target.closest('.sroot')) return;   // nodo/root gestiscono da soli
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    if (pointers.size === 1) {
      var now = Date.now();
      if (now - lastBgTap < 300) { S.view = { k: 1, tx: 0, ty: 0 }; applyView(); }  // doppio tap = reset
      lastBgTap = now;
      gesture = { mode: 'pan', lastX: e.clientX, lastY: e.clientY };
    } else if (pointers.size === 2) { startPinch(); }
  });
  svg.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    var pts = Array.from(pointers.values());
    if (pts.length >= 2) {
      if (!gesture || gesture.mode !== 'pinch') startPinch();
      var d = distp(pts[0], pts[1]);
      var k = Math.max(0.3, Math.min(4, gesture.k0 * (d / gesture.d0)));
      var mid = svgPt((pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2);
      S.view.k = k;
      S.view.tx = mid.x - gesture.wx * k;
      S.view.ty = mid.y - gesture.wy * k;
      applyView();
    } else if (gesture && gesture.mode === 'pan') {
      S.view.tx += pts[0].x - gesture.lastX;
      S.view.ty += pts[0].y - gesture.lastY;
      gesture.lastX = pts[0].x; gesture.lastY = pts[0].y;
      applyView();
    }
  });
  function bgUp(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
    var pts = Array.from(pointers.values());
    if (pts.length === 1) gesture = { mode: 'pan', lastX: pts[0].x, lastY: pts[0].y };
    else if (pts.length === 0) gesture = null;
  }
  svg.addEventListener('pointerup', bgUp);
  svg.addEventListener('pointercancel', bgUp);

  $('center-btn').onclick = fitView;
  window.addEventListener('resize', render);
  $('node-text').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('add-btn').click();
  });
})();
</script>
</body>
</html>
