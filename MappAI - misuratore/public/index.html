<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'">
<title>MappAI - misuratore</title>
<link rel="stylesheet" href="css/misuratore.css">
</head>
<body>

<div class="wrap">

  <header class="hero">
    <h1 id="app-titolo">MappAI - misuratore</h1>
    <p id="app-sottotitolo">Misura l’accessibilità del materiale generato da MappAI</p>
  </header>

  <!-- Tre tab, stesso pattern di commutazione della landing MappAI (FR-047) -->
  <div class="tabbar" role="tablist" aria-label="Sezioni">
    <button role="tab" id="tab-analizza"  aria-controls="pan-analizza"  aria-selected="true">ANALIZZA</button>
    <button role="tab" id="tab-andamento" aria-controls="pan-andamento" aria-selected="false">ANDAMENTO</button>
    <button role="tab" id="tab-metodo"    aria-controls="pan-metodo"    aria-selected="false">METODO</button>
    <button role="tab" id="tab-basi"      aria-controls="pan-basi"      aria-selected="false">BASI SCIENTIFICHE</button>
  </div>

  <section class="tabpanel" id="pan-analizza" role="tabpanel" aria-labelledby="tab-analizza">

    <div class="azioni">
      <button class="btn-azione" id="btn-car-vault">
        <i data-lucide="folder-tree"></i>
        <span>Carica un vault</span>
      </button>
      <button class="btn-azione" id="btn-car-pdf">
        <i data-lucide="file-text"></i>
        <span>Carica dei PDF</span>
      </button>
      <button class="btn-azione" id="btn-car-classe">
        <i data-lucide="library"></i>
        <span>Carica una classe intera</span>
      </button>
    </div>

    <div class="barra-selezione">
      <span class="conteggio" id="sel-conteggio">Nessun elemento selezionato</span>
      <button class="btn btn-primario" id="btn-avvia" disabled>Avvia analisi</button>
    </div>

    <details class="sezione" id="sez-elementi" open>
      <summary>
        <span class="ico"><i data-lucide="inbox"></i></span>
        Materiale caricato
        <span class="conta" id="conta-elementi"></span>
        <span class="chevron"><i data-lucide="chevron-down"></i></span>
      </summary>
      <div class="sezione-corpo" id="corpo-elementi"></div>
    </details>

    <details class="sezione" id="sez-report" open>
      <summary>
        <span class="ico"><i data-lucide="file-bar-chart"></i></span>
        Report prodotti
        <span class="conta" id="conta-report"></span>
        <span class="chevron"><i data-lucide="chevron-down"></i></span>
      </summary>
      <div class="sezione-corpo" id="corpo-report"></div>
    </details>

  </section>

  <section class="tabpanel" id="pan-andamento" role="tabpanel" aria-labelledby="tab-andamento" hidden>
    <div id="corpo-andamento"></div>
  </section>

  <section class="tabpanel" id="pan-metodo" role="tabpanel" aria-labelledby="tab-metodo" hidden>
    <div id="corpo-metodo"></div>
  </section>

  <!-- Documento autoconsistente in pitch/, mostrato dentro l'app. L'iframe evita
       un canale IPC in più e mantiene tutto offline (FR-051). -->
  <section class="tabpanel" id="pan-basi" role="tabpanel" aria-labelledby="tab-basi" hidden>
    <div class="barra-selezione">
      <span class="conteggio">Basi scientifiche e proposta di sperimentazione didattica — fonti verificate</span>
      <button class="btn" id="btn-basi-finestra">Apri a tutta finestra</button>
      <button class="btn" id="btn-basi-stampa">Stampa</button>
    </div>
    <div id="basi-host" style="border:1px solid var(--slate-200);border-radius:var(--raggio);
         overflow:hidden;background:var(--bianco);height:calc(100vh - 320px);min-height:520px">
      <iframe id="basi-frame" title="Basi scientifiche" src="../pitch/basi-scientifiche.html"
              style="border:0;width:100%;height:100%;display:block"></iframe>
    </div>
  </section>

</div>

<footer class="footer-app">
  <button class="btn" id="btn-cartella-dati">Apri la cartella dei file</button>
  <span id="ft-radice"></span>
  <span style="margin-left:auto" id="ft-versione"></span>
</footer>

<!-- Vendor, offline (FR-051) -->
<script src="js/vendor/spacemono-font.js"></script>
<script src="js/vendor/lucide.min.js"></script>

<!-- Riuso dichiarato da MappAI (RIUSO.md) -->
<script src="js/riuso/files-names.js"></script>
<script src="js/riuso/it-tokens.js"></script>
<script src="js/riuso/edge-families.js"></script>
<script src="js/riuso/quiz-normalize.js"></script>

<!-- Core puri -->
<script src="js/core/mis-profile-core.js"></script>

<!-- i18n e bootstrap -->
<script src="js/i18n/it.js"></script>
<script src="js/app.js"></script>

</body>
</html>
