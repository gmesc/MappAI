<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'">
<title>Report — MappAI - misuratore</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f6f2; }
  /* Il report è autoconsistente (FR-038): qui dentro vive senza toccare
     i token dell'app, perché ha un linguaggio visivo suo (FR-050). */
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<iframe id="telaio" title="Report" sandbox="allow-same-origin"></iframe>
<script>
  // Il percorso del report arriva come parametro di query dalla finestra main.
  const p = new URLSearchParams(location.search).get('f');
  if (p) document.getElementById('telaio').src = p;
</script>
</body>
</html>
