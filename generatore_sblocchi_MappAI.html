<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapp.AI — Unlock Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Mono', monospace; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="bg-[#f0f4ff] flex items-center justify-center min-h-screen p-6 relative overflow-hidden">
    <!-- Decorative background elements -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-200/30 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-200/30 rounded-full blur-[120px]"></div>

    <div class="glass-effect p-8 rounded-[2rem] shadow-2xl w-full max-w-md relative z-10">
        <div class="flex items-center gap-3 mb-8">
            <div class="p-2 bg-indigo-600 text-white rounded-xl shadow-lg shadow-indigo-200">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-key-round"><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight">Mapp.AI <span class="text-indigo-600">Unlock</span></h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Generator Tool v2.0</p>
            </div>
        </div>
        
        <div class="space-y-6">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 px-1">ID Macchina del Tester</label>
                <input type="text" id="machine-id" 
                    class="w-full px-4 py-4 bg-white/50 border border-slate-200 rounded-2xl font-mono text-lg focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:outline-none uppercase transition-all placeholder:text-slate-300" 
                    placeholder="Es. A1B2C3D4E5">
            </div>
            
            <button onclick="generate()" 
                class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-xl shadow-indigo-200 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                Genera Codice di Sblocco
            </button>
            
            <div id="result-container" class="hidden animate-in fade-in slide-in-from-top-4 duration-500">
                <div class="h-[1px] bg-slate-200 w-full my-6"></div>
                <label class="block text-[10px] font-bold text-emerald-600 uppercase tracking-widest mb-2 px-1">Codice da inviare al Tester</label>
                <div class="bg-emerald-50 border border-emerald-100 p-6 rounded-2xl text-center group cursor-pointer active:scale-[0.98] transition-transform" onclick="copyToClipboard()">
                    <span id="unlock-code" class="font-mono font-black text-3xl text-emerald-700 tracking-[0.2em]"></span>
                </div>
                <p class="text-[9px] text-slate-400 mt-4 text-center font-bold leading-relaxed px-4">
                    Clicca sul codice per copiarlo. <br>
                    Funzionerà solo sul dispositivo con l'ID indicato.
                </p>
            </div>
        </div>
    </div>

    <script>
        const SECRET_SALT = "MAPP_AI_GIACOMO_2026_BETA_SECURE";

        async function generate() {
            const macId = document.getElementById('machine-id').value.trim().toUpperCase();
            if(!macId) {
                return;
            }

            const encoder = new TextEncoder();
            const data = encoder.encode(macId + SECRET_SALT);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            const unlockCode = hashHex.substring(0, 10).toUpperCase();

            document.getElementById('unlock-code').innerText = unlockCode;
            document.getElementById('result-container').classList.remove('hidden');
        }

        function copyToClipboard() {
            const code = document.getElementById('unlock-code').innerText;
            navigator.clipboard.writeText(code);
            alert("Codice copiato!");
        }
    </script>
</body>
</html>
